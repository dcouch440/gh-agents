<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Theme detection — must run before first paint (mirrors uiStore.ts:46-58) -->
    <script>
      (function() {
        var t = 'dark';
        try {
          var s = localStorage.getItem('nexor_theme');
          if (s === 'light' || s === 'dark') t = s;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch(e) {}
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'dark' ? '#080c12' : '#F9F6F1';
      })();
    </script>

    <!-- Splash screen styles — inline so they're available before any bundled CSS -->
    <style>
      html, body { margin: 0; padding: 0; }

      /* Theme tokens — consumed by splash SVG and text */
      html[data-theme="dark"] {
        --splash-bg: #080c12;
        --splash-gear-1: #3b82f6;
        --splash-gear-2: #2dd4bf;
        --splash-glow-opacity: 0.55;
        --splash-wordmark: #3b82f6;
      }
      html[data-theme="light"] {
        --splash-bg: #F9F6F1;
        --splash-gear-1: #FF964F;
        --splash-gear-2: #D47830;
        --splash-glow-opacity: 0.4;
        --splash-wordmark: #D47830;
      }

      #nexor-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        opacity: 1;
        transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }

      #nexor-splash.splash-exit  { opacity: 0; }
      #nexor-splash.splash-hidden { display: none; }

      /* Gear rotation */
      @keyframes nexor-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .nexor-gear {
        width: 72px;
        height: 72px;
        animation: nexor-spin 4s linear infinite;
        transition: transform 700ms cubic-bezier(0.4, 0, 0.2, 1), opacity 600ms ease;
      }
      #nexor-splash.splash-exit .nexor-gear {
        transform: translateY(-40px);
        opacity: 0;
      }

      /* Wordmark pulse */
      @keyframes nexor-pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }
      .nexor-wordmark {
        font-family: 'VT323', monospace;
        font-size: 26px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--splash-wordmark);
        animation: nexor-pulse 2.4s ease-in-out infinite;
      }

      /* Accessibility: respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .nexor-gear     { animation-duration: 0s; transition-duration: 0s; }
        .nexor-wordmark { animation-duration: 0s; opacity: 1; }
        #nexor-splash   { transition-duration: 0s; }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexor</title>
  </head>
  <body>
    <!-- Splash screen — visible until React signals ready -->
    <div id="nexor-splash">
      <svg class="nexor-gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#2dd4bf" />
          </linearGradient>
          <filter id="gear-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" />
            <feFlood flood-color="#3b82f6" flood-opacity="0.55" />
            <feComposite in2="blur" operator="in" result="glow" />
            <feMerge>
              <feMergeNode in="glow" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g class="nexor-gear-group" filter="url(#gear-glow)" transform="translate(50,50)">
          <!-- 12-tooth gear: outer r=38, root r=30, computed for perfect symmetry -->
          <path
            fill="none"
            stroke="url(#gear-grad)"
            stroke-width="2"
            stroke-linejoin="round"
            d="
              M -4,-37.8 L 4,-37.8 L 4.7,-29.6 L 10.8,-28
              L 15.5,-34.7 L 22.3,-30.7 L 18.9,-23.3 L 23.3,-18.9
              L 30.7,-22.3 L 34.7,-15.5 L 28,-10.8 L 29.6,-4.7
              L 37.8,-4 L 37.8,4 L 29.6,4.7 L 28,10.8
              L 34.7,15.5 L 30.7,22.3 L 23.3,18.9 L 18.9,23.3
              L 22.3,30.7 L 15.5,34.7 L 10.8,28 L 4.7,29.6
              L 4,37.8 L -4,37.8 L -4.7,29.6 L -10.8,28
              L -15.5,34.7 L -22.3,30.7 L -18.9,23.3 L -23.3,18.9
              L -30.7,22.3 L -34.7,15.5 L -28,10.8 L -29.6,4.7
              L -37.8,4 L -37.8,-4 L -29.6,-4.7 L -28,-10.8
              L -34.7,-15.5 L -30.7,-22.3 L -23.3,-18.9 L -18.9,-23.3
              L -22.3,-30.7 L -15.5,-34.7 L -10.8,-28 L -4.7,-29.6 Z
            "
          />
          <!-- Hub ring -->
          <circle cx="0" cy="0" r="13" fill="none" stroke="url(#gear-grad)" stroke-width="2" />
          <!-- Bore -->
          <circle cx="0" cy="0" r="5" fill="none" stroke="url(#gear-grad)" stroke-width="1.5" />
        </g>
      </svg>
      <div class="nexor-wordmark">nexor</div>
      <script>
        (function() {
          var dark = document.documentElement.getAttribute('data-theme') !== 'light';
          if (dark) return; // SVG defaults are already dark-themed
          var stops = document.querySelectorAll('#gear-grad stop');
          stops[0].setAttribute('stop-color', '#FF964F');
          stops[1].setAttribute('stop-color', '#D47830');
          var flood = document.querySelector('#gear-glow feFlood');
          flood.setAttribute('flood-color', '#FF964F');
          flood.setAttribute('flood-opacity', '0.4');
        })();
      </script>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
