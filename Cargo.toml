[package]
name = "nexor"
version = "0.1.0"
edition = "2021"
authors = ["David Couch"]
description = "AI Agent Orchestration TUI for GitHub Workflows"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"

# Async utilities
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# HTTP client (for LLM APIs)
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# Configuration
dirs = "5"

[dev-dependencies]
tempfile = "3"
