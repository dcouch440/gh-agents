[package]
name = "nexor"
version = "0.1.0"
edition = "2021"
authors = ["David Couch"]
description = "AI Agent Orchestration for GitHub Workflows"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
tokio-util = "0.7"

# Web server
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# WebSocket
tokio-tungstenite = "0.21"

# Authentication
argon2 = "0.5"
jsonwebtoken = "9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Text similarity & diffing
strsim = "0.11"
similar = "2"
diffy = "0.4"

# Image rasterization (stroke → vision LLM pipeline)
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.11"
base64 = "0.22"

# Archive
zip = { version = "2", default-features = false, features = ["deflate"] }

# Utilities
regex = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-bunyan-formatter = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Async utilities
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# Concurrent collections
dashmap = "6"

# HTTP client (for LLM APIs and the web tools)
# gzip/brotli/deflate: servers negotiate these by default, and without the
# features enabled reqwest advertises them and then cannot decode the body.
reqwest = { version = "0.12", features = [
    "rustls-tls", "json", "stream", "cookies", "gzip", "brotli", "deflate",
] }

# Web page extraction (read_webpage)
# dom_smoothie: Mozilla Readability port; TextMode::Markdown yields markdown
# directly. fast_html2md: fallback for pages readability cannot resolve.
dom_smoothie = "0.18"
fast_html2md = "0.0.62"
encoding_rs = "0.8"
url = "2"

# S3-compatible object storage (MinIO in dev, real S3 in prod)
aws-sdk-s3 = "1"
aws-config = "1"

# Configuration
dirs = "5"
once_cell = "1"
dotenvy = "0.15"
ignore = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }
tower_governor = "0.4"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
bytes = "1.11.1"

[dev-dependencies]
# `test-util` gives tests a pausable clock, so throttle tests assert real
# wait behaviour without actually sleeping. Dev-only: it must not ship.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
mockall = "0.13"
