[package]
name = "nexor"
version = "0.1.0"
edition = "2021"
authors = ["David Couch"]
description = "AI Agent Orchestration for GitHub Workflows"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Web server
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# WebSocket
tokio-tungstenite = "0.21"

# Authentication
argon2 = "0.5"
jsonwebtoken = "9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Utilities
regex = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-bunyan-formatter = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Async utilities
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# Concurrent collections
dashmap = "6"

# HTTP client (for LLM APIs)
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# Configuration
dirs = "5"
once_cell = "1"
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }
tower_governor = "0.4"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
mockall = "0.13"
