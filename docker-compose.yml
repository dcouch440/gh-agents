name: nexor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexor
      POSTGRES_PASSWORD: nexor
      POSTGRES_DB: nexor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-juicefs-db.sql:/docker-entrypoint-initdb.d/init-juicefs-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexor"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  juicefs:
    image: juicedata/mount:ce-v1.2.1
    container_name: nexor-juicefs
    volumes:
      - jfs-workspace:/mnt/jfs
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    command: >
      juicefs mount
      --cache-dir /tmp/jfs-cache
      --cache-size 1024
      "postgres://nexor:nexor@postgres:5432/juicefs?sslmode=disable"
      /mnt/jfs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ls /mnt/jfs/.accesschk 2>/dev/null || touch /mnt/jfs/.accesschk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - server

  nexor-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: nexor-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://nexor:nexor@postgres:5432/nexor
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nexor-system-store
      RUST_ENV: development
      NEXOR_STATIC_DIR: /app/frontend/dist
      WORKSPACE_MOUNT_POINT: /mnt/jfs
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jfs-workspace:/mnt/jfs
    cap_add:
      - SYS_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      juicefs:
        condition: service_healthy
    profiles:
      - server

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: nexor-wg-easy
    environment:
      LANG: en
      WG_HOST: host.docker.internal
      PASSWORD_HASH: "${WGEASY_PASSWORD_HASH}"
      PORT: "51821"
      WG_PORT: "51820"
      WG_DEFAULT_DNS: "10.8.0.1"
    volumes:
      - wg-easy-data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    profiles:
      - vpn

volumes:
  pgdata:
    name: gh-agents_pgdata
    external: true
  minio-data:
    name: gh-agents_minio-data
    external: true
  wg-easy-data:
    name: nexor-wg-easy-data
  jfs-workspace:
    name: nexor-jfs-workspace
