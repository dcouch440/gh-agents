services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexor
      POSTGRES_PASSWORD: nexor
      POSTGRES_DB: nexor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-juicefs-db.sql:/docker-entrypoint-initdb.d/init-juicefs-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexor"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: nexor-wg-easy
    environment:
      LANG: en
      WG_HOST: host.docker.internal
      PASSWORD_HASH: "$$2y$$10$$hBCoykrB95WSzuV4fafBzOHWKu9sbyVa34GJim6Lzt8/G23OjBYga"
      PORT: "51821"
      WG_PORT: "51820"
      WG_DEFAULT_DNS: "10.8.0.1"
    volumes:
      - wg-easy-data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    profiles:
      - vpn

volumes:
  pgdata:
  minio-data:
  wg-easy-data:
