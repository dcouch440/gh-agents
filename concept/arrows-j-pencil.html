<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>J. Pencil Sketch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e2e; color: #cdd6f4; font-family: system-ui, sans-serif; padding: 40px; }
    h1 { font-size: 24px; margin-bottom: 8px; font-weight: 400; }
    p.desc { font-size: 13px; color: #6c7086; margin-bottom: 24px; line-height: 1.5; max-width: 700px; }
    .back { color: #6c7086; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 24px; }
    .back:hover { color: #cdd6f4; }
    canvas { border-radius: 12px; display: block; background: #181825; }
    .tag { display: inline-block; background: #313244; color: #f5c2e7; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to index</a>
  <h1>J. Pencil Sketch</h1>
  <p class="desc">Multiple thin overlapping strokes that simulate a pencil going back and forth over the same line. Each stroke has its own wobble and slight variation. Rougher and more raw than Excalidraw — closer to an actual sketch.</p>
  <span class="tag">multi-stroke</span><span class="tag">pencil texture</span><span class="tag">0.5-1.5px</span><span class="tag">20px gap</span>
  <canvas id="canvas" width="740" height="360"></canvas>

  <script src="shared.js"></script>
  <script>
    const { ctx } = initCanvas('canvas', 740, 360)
    const scene = getScene(20)
    drawBoxes(ctx, scene.boxes, 88)

    const rng = mulberry32(123)

    for (const a of scene.arrows) {
      ctx.lineCap = 'round'

      // Multiple pencil strokes
      const strokes = 8
      for (let s = 0; s < strokes; s++) {
        // Each stroke has a base offset (like the pencil slightly drifting)
        const baseOffX = (rng() - 0.5) * 3
        const baseOffY = (rng() - 0.5) * 3
        const width = 0.5 + rng() * 1.0 // 0.5 - 1.5px
        const alpha = 0.15 + rng() * 0.2 // 0.15 - 0.35

        ctx.strokeStyle = STROKE
        ctx.globalAlpha = alpha
        ctx.lineWidth = width

        // Draw as segmented polyline with per-segment wobble
        const segments = 20 + Math.floor(rng() * 10)
        ctx.beginPath()
        for (let i = 0; i <= segments; i++) {
          const t = i / segments
          const pt = bezierPoint(t, a.start, a.cp1, a.cp2, a.end)
          // Per-point wobble increases slightly in the middle
          const midFactor = 1 + Math.sin(t * Math.PI) * 0.5
          const wx = baseOffX + (rng() - 0.5) * 2 * midFactor
          const wy = baseOffY + (rng() - 0.5) * 2 * midFactor

          if (i === 0) ctx.moveTo(pt.x + wx, pt.y + wy)
          else ctx.lineTo(pt.x + wx, pt.y + wy)
        }
        ctx.stroke()
      }
      ctx.globalAlpha = 1

      // Arrowhead — pencil-style barbs (multiple light strokes)
      const angle = Math.atan2(a.end.y - a.cp2.y, a.end.x - a.cp2.x)
      const spread = Math.PI / 5.5
      const headSize = 18

      for (let s = 0; s < 5; s++) {
        const ox = (rng() - 0.5) * 2
        const oy = (rng() - 0.5) * 2
        ctx.strokeStyle = STROKE
        ctx.globalAlpha = 0.2 + rng() * 0.2
        ctx.lineWidth = 0.5 + rng() * 1.0

        // Left barb
        ctx.beginPath()
        ctx.moveTo(
          a.end.x - headSize * Math.cos(angle - spread) + ox + (rng()-0.5)*2,
          a.end.y - headSize * Math.sin(angle - spread) + oy + (rng()-0.5)*2,
        )
        ctx.lineTo(a.end.x + ox*0.2, a.end.y + oy*0.2)
        ctx.stroke()

        // Right barb
        ctx.beginPath()
        ctx.moveTo(
          a.end.x - headSize * Math.cos(angle + spread) + ox + (rng()-0.5)*2,
          a.end.y - headSize * Math.sin(angle + spread) + oy + (rng()-0.5)*2,
        )
        ctx.lineTo(a.end.x + ox*0.2, a.end.y + oy*0.2)
        ctx.stroke()
      }
      ctx.globalAlpha = 1
    }
  </script>
</body>
</html>
