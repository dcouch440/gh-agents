<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G. Neon Glow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e2e; color: #cdd6f4; font-family: system-ui, sans-serif; padding: 40px; }
    h1 { font-size: 24px; margin-bottom: 8px; font-weight: 400; }
    p.desc { font-size: 13px; color: #6c7086; margin-bottom: 24px; line-height: 1.5; max-width: 700px; }
    .back { color: #6c7086; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 24px; }
    .back:hover { color: #cdd6f4; }
    canvas { border-radius: 12px; display: block; background: #181825; }
    .tag { display: inline-block; background: #313244; color: #cba6f7; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to index</a>
  <h1>G. Neon Glow</h1>
  <p class="desc">Thin core stroke with a soft colored glow halo behind it. The arrow glows like a neon sign — the halo gives it presence without being thick. Futuristic whiteboard energy. Big standoff from boxes.</p>
  <span class="tag">2px core</span><span class="tag">glow halo</span><span class="tag">20px gap</span>
  <canvas id="canvas" width="740" height="360"></canvas>

  <script src="shared.js"></script>
  <script>
    const { ctx } = initCanvas('canvas', 740, 360)
    const scene = getScene(20)
    drawBoxes(ctx, scene.boxes, 42)

    const glowColor = '#89b4fa'

    for (const a of scene.arrows) {
      // Outer glow layers (multiple passes, increasing blur)
      ctx.save()
      ctx.lineCap = 'round'
      ctx.lineJoin = 'round'

      // Widest glow
      ctx.strokeStyle = glowColor + '08'
      ctx.lineWidth = 20
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()

      // Medium glow
      ctx.strokeStyle = glowColor + '15'
      ctx.lineWidth = 12
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()

      // Inner glow
      ctx.strokeStyle = glowColor + '30'
      ctx.lineWidth = 6
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()

      // Core stroke
      ctx.strokeStyle = glowColor
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()

      // Bright center
      ctx.strokeStyle = '#ffffff'
      ctx.globalAlpha = 0.4
      ctx.lineWidth = 1
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()
      ctx.globalAlpha = 1

      // Arrowhead — filled triangle with glow
      const angle = Math.atan2(a.end.y - a.cp2.y, a.end.x - a.cp2.x)
      const spread = Math.PI / 6
      const headSize = 16

      // Head glow
      ctx.fillStyle = glowColor + '25'
      ctx.beginPath()
      ctx.moveTo(a.end.x, a.end.y)
      ctx.lineTo(a.end.x - (headSize+6) * Math.cos(angle - spread*1.2), a.end.y - (headSize+6) * Math.sin(angle - spread*1.2))
      ctx.lineTo(a.end.x - (headSize+6) * Math.cos(angle + spread*1.2), a.end.y - (headSize+6) * Math.sin(angle + spread*1.2))
      ctx.closePath()
      ctx.fill()

      // Head core
      ctx.fillStyle = glowColor
      ctx.beginPath()
      ctx.moveTo(a.end.x, a.end.y)
      ctx.lineTo(a.end.x - headSize * Math.cos(angle - spread), a.end.y - headSize * Math.sin(angle - spread))
      ctx.lineTo(a.end.x - headSize * Math.cos(angle + spread), a.end.y - headSize * Math.sin(angle + spread))
      ctx.closePath()
      ctx.fill()

      ctx.restore()
    }
  </script>
</body>
</html>
