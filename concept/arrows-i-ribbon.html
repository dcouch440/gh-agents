<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I. Ribbon Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e2e; color: #cdd6f4; font-family: system-ui, sans-serif; padding: 40px; }
    h1 { font-size: 24px; margin-bottom: 8px; font-weight: 400; }
    p.desc { font-size: 13px; color: #6c7086; margin-bottom: 24px; line-height: 1.5; max-width: 700px; }
    .back { color: #6c7086; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 24px; }
    .back:hover { color: #cdd6f4; }
    canvas { border-radius: 12px; display: block; background: #181825; }
    .tag { display: inline-block; background: #313244; color: #a6e3a1; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to index</a>
  <h1>I. Ribbon Flow</h1>
  <p class="desc">Wide flat ribbon that follows the curve. Subtle gradient from a muted start to a brighter end. Feels like data flowing between nodes — a visual stream rather than a pointer.</p>
  <span class="tag">8px ribbon</span><span class="tag">gradient fill</span><span class="tag">16px gap</span><span class="tag">tapered ends</span>
  <canvas id="canvas" width="740" height="360"></canvas>

  <script src="shared.js"></script>
  <script>
    const { canvas, ctx } = initCanvas('canvas', 740, 360)
    const scene = getScene(16)
    drawBoxes(ctx, scene.boxes, 33)

    const ribbonColors = [
      { start: '#6c708640', end: '#89b4fa60' },
      { start: '#6c708640', end: '#a6e3a160' },
      { start: '#6c708640', end: '#cba6f760' },
    ]

    for (let ai = 0; ai < scene.arrows.length; ai++) {
      const a = scene.arrows[ai]
      const colors = ribbonColors[ai]

      // Build ribbon as a filled shape by offsetting the curve
      const segments = 60
      const ribbonWidth = 8
      const topPoints = []
      const bottomPoints = []

      for (let i = 0; i <= segments; i++) {
        const t = i / segments
        const pt = bezierPoint(t, a.start, a.cp1, a.cp2, a.end)
        const tan = bezierTangent(t, a.start, a.cp1, a.cp2, a.end)
        const len = Math.sqrt(tan.x*tan.x + tan.y*tan.y) || 1
        const nx = -tan.y / len
        const ny = tan.x / len

        // Taper at start and end
        const taper = Math.min(1, t * 8, (1 - t) * 8) // quick ramp up/down
        const halfW = ribbonWidth / 2 * taper

        topPoints.push({ x: pt.x + nx * halfW, y: pt.y + ny * halfW })
        bottomPoints.push({ x: pt.x - nx * halfW, y: pt.y - ny * halfW })
      }

      // Create gradient
      const grad = ctx.createLinearGradient(a.start.x, a.start.y, a.end.x, a.end.y)
      grad.addColorStop(0, colors.start)
      grad.addColorStop(1, colors.end)

      // Fill ribbon shape
      ctx.fillStyle = grad
      ctx.beginPath()
      ctx.moveTo(topPoints[0].x, topPoints[0].y)
      for (let i = 1; i < topPoints.length; i++) {
        ctx.lineTo(topPoints[i].x, topPoints[i].y)
      }
      for (let i = bottomPoints.length - 1; i >= 0; i--) {
        ctx.lineTo(bottomPoints[i].x, bottomPoints[i].y)
      }
      ctx.closePath()
      ctx.fill()

      // Thin bright center line
      const centerGrad = ctx.createLinearGradient(a.start.x, a.start.y, a.end.x, a.end.y)
      centerGrad.addColorStop(0, '#6c708650')
      centerGrad.addColorStop(1, colors.end.replace('60', 'aa'))

      ctx.strokeStyle = centerGrad
      ctx.lineWidth = 1.5
      ctx.lineCap = 'round'
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()

      // Arrowhead — filled triangle matching gradient end color
      const angle = Math.atan2(a.end.y - a.cp2.y, a.end.x - a.cp2.x)
      const spread = Math.PI / 5.5
      const headSize = 18

      ctx.fillStyle = colors.end.replace('60', '90')
      ctx.beginPath()
      ctx.moveTo(a.end.x, a.end.y)
      ctx.lineTo(a.end.x - headSize * Math.cos(angle - spread), a.end.y - headSize * Math.sin(angle - spread))
      ctx.lineTo(a.end.x - headSize * 0.5 * Math.cos(angle), a.end.y - headSize * 0.5 * Math.sin(angle))
      ctx.lineTo(a.end.x - headSize * Math.cos(angle + spread), a.end.y - headSize * Math.sin(angle + spread))
      ctx.closePath()
      ctx.fill()
    }
  </script>
</body>
</html>
