<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>H. Dry Marker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e2e; color: #cdd6f4; font-family: system-ui, sans-serif; padding: 40px; }
    h1 { font-size: 24px; margin-bottom: 8px; font-weight: 400; }
    p.desc { font-size: 13px; color: #6c7086; margin-bottom: 24px; line-height: 1.5; max-width: 700px; }
    .back { color: #6c7086; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 24px; }
    .back:hover { color: #cdd6f4; }
    canvas { border-radius: 12px; display: block; background: #181825; }
    .tag { display: inline-block; background: #313244; color: #fab387; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to index</a>
  <h1>H. Dry Marker</h1>
  <p class="desc">Wide semi-transparent stroke that looks like a dry-erase marker on a whiteboard. Multiple overlapping strokes at slightly different positions create natural texture. Casual and physical.</p>
  <span class="tag">5-7px wide</span><span class="tag">textured</span><span class="tag">semi-transparent</span><span class="tag">20px gap</span>
  <canvas id="canvas" width="740" height="360"></canvas>

  <script src="shared.js"></script>
  <script>
    const { ctx } = initCanvas('canvas', 740, 360)
    const scene = getScene(20)
    drawBoxes(ctx, scene.boxes, 55)

    const rng = mulberry32(77)

    for (const a of scene.arrows) {
      ctx.lineCap = 'round'
      ctx.lineJoin = 'round'

      // Multiple overlapping marker strokes
      const passes = 5
      for (let pass = 0; pass < passes; pass++) {
        const width = 5 + (rng() - 0.5) * 3 // 3.5-6.5px
        const offsetX = (rng() - 0.5) * 3
        const offsetY = (rng() - 0.5) * 3

        ctx.strokeStyle = STROKE
        ctx.globalAlpha = 0.15 + rng() * 0.1 // 0.15-0.25 per pass
        ctx.lineWidth = width

        ctx.beginPath()
        ctx.moveTo(
          a.start.x + offsetX,
          a.start.y + offsetY,
        )
        ctx.bezierCurveTo(
          a.cp1.x + offsetX + (rng()-0.5)*4,
          a.cp1.y + offsetY + (rng()-0.5)*4,
          a.cp2.x + offsetX + (rng()-0.5)*4,
          a.cp2.y + offsetY + (rng()-0.5)*4,
          a.end.x + offsetX,
          a.end.y + offsetY,
        )
        ctx.stroke()
      }
      ctx.globalAlpha = 1

      // One solid thin stroke on top for definition
      ctx.strokeStyle = STROKE
      ctx.globalAlpha = 0.5
      ctx.lineWidth = 1.5
      ctx.beginPath()
      ctx.moveTo(a.start.x, a.start.y)
      ctx.bezierCurveTo(a.cp1.x, a.cp1.y, a.cp2.x, a.cp2.y, a.end.x, a.end.y)
      ctx.stroke()
      ctx.globalAlpha = 1

      // Arrowhead — marker-style thick open barb
      const angle = Math.atan2(a.end.y - a.cp2.y, a.end.x - a.cp2.x)
      const spread = Math.PI / 5
      const headSize = 20

      // Multiple barb strokes for texture
      for (let pass = 0; pass < 3; pass++) {
        const ox = (rng()-0.5) * 2
        const oy = (rng()-0.5) * 2
        ctx.strokeStyle = STROKE
        ctx.globalAlpha = 0.25 + pass * 0.1
        ctx.lineWidth = 4 + (rng()-0.5) * 2
        ctx.beginPath()
        ctx.moveTo(
          a.end.x - headSize * Math.cos(angle - spread) + ox,
          a.end.y - headSize * Math.sin(angle - spread) + oy,
        )
        ctx.lineTo(a.end.x + ox*0.3, a.end.y + oy*0.3)
        ctx.lineTo(
          a.end.x - headSize * Math.cos(angle + spread) + ox,
          a.end.y - headSize * Math.sin(angle + spread) + oy,
        )
        ctx.stroke()
      }
      ctx.globalAlpha = 1

      // Thin definition barb on top
      ctx.strokeStyle = STROKE
      ctx.globalAlpha = 0.6
      ctx.lineWidth = 1.5
      ctx.beginPath()
      ctx.moveTo(
        a.end.x - headSize * Math.cos(angle - spread),
        a.end.y - headSize * Math.sin(angle - spread),
      )
      ctx.lineTo(a.end.x, a.end.y)
      ctx.lineTo(
        a.end.x - headSize * Math.cos(angle + spread),
        a.end.y - headSize * Math.sin(angle + spread),
      )
      ctx.stroke()
      ctx.globalAlpha = 1
    }
  </script>
</body>
</html>
