# ============================================================================
# System Execution Constraints
# ============================================================================
# Defines safety limits and constraints for workflow execution.
# These are admin-controlled and enforced system-wide.
#
# Constraints prevent runaway executions, infinite loops, excessive costs,
# and other potentially dangerous scenarios.
#
# Sync to database: cargo run -- sync-config
# ============================================================================

# Constraint Structure:
# ---------------------
# key:          Unique constraint identifier
# value:        Constraint value (number, boolean, string)
# description:  What this constraint limits
# rationale:    Why this constraint exists
# tenant_override: Can tenants override this? (true/false)

constraints:
  # ==========================================================================
  # EXECUTION TIME LIMITS
  # ==========================================================================

  max_execution_time_minutes:
    value: 60
    type: integer
    description: Maximum execution time for a single workflow in minutes
    rationale: >
      Prevents hung workflows from consuming resources indefinitely.
      Long-running workflows (>60 min) should be split into smaller workflows
      or use checkpoints.
    tenant_override: true
    recommended_range: [15, 180]
    notes: >
      Consider breaking workflows into phases if they regularly approach this limit.

  max_step_execution_time_minutes:
    value: 15
    type: integer
    description: Maximum execution time for a single step in minutes
    rationale: >
      Individual steps should complete quickly. Long steps indicate
      too much work in one step.
    tenant_override: true
    recommended_range: [5, 30]

  # ==========================================================================
  # COST CONSTRAINTS
  # ==========================================================================

  max_cost_per_execution_usd:
    value: 10.0
    type: float
    description: Maximum cost (in USD) for a single workflow execution
    rationale: >
      Prevents unexpectedly expensive workflows from running up bills.
      Execution is halted when cost limit is reached.
    tenant_override: true
    recommended_range: [1.0, 50.0]
    notes: >
      Based on LLM API costs (input/output tokens).
      Adjust based on use case and budget.

  max_tokens_per_step:
    value: 100000
    type: integer
    description: Maximum tokens (input + output) for a single step execution
    rationale: >
      Prevents individual steps from using excessive tokens.
      Steps approaching this limit should be broken down or use summarization.
    tenant_override: true
    recommended_range: [50000, 200000]
    notes: >
      Claude Opus 4 context is 200K tokens. This leaves room for multiple steps
      while preventing single steps from dominating token usage.

  # ==========================================================================
  # PARALLELISM CONSTRAINTS
  # ==========================================================================

  max_parallel_for_each:
    value: 20
    type: integer
    description: Maximum parallel iterations in for-each steps
    rationale: >
      Prevents excessive parallelism that could overwhelm the system or APIs.
      For arrays larger than this, use batch processing or reduce scope.
    tenant_override: true
    recommended_range: [10, 50]
    notes: >
      Consider rate limits of external APIs when adjusting this.

  max_parallel_steps:
    value: 5
    type: integer
    description: Maximum number of workflow steps executing in parallel
    rationale: >
      Limits concurrent step execution to prevent resource exhaustion.
      Highly parallel workflows should be redesigned or split.
    tenant_override: true
    recommended_range: [3, 10]

  # ==========================================================================
  # SAFETY CONSTRAINTS
  # ==========================================================================

  unsafe_operations_enabled:
    value: false
    type: boolean
    description: Enable unsafe operations (shell execution, dangerous commands)
    rationale: >
      CRITICAL SAFETY CONTROL: Disables dangerous tools by default.
      Only enable in sandboxed environments or with explicit approval.
    tenant_override: false  # Admin-only override
    notes: >
      When false, tools with safety_level=unsafe are blocked.
      When true, they require per-execution approval.

  dangerous_tools_require_approval:
    value: true
    type: boolean
    description: Require explicit approval before executing dangerous tools
    rationale: >
      Even when unsafe operations are enabled, require human approval
      before each dangerous operation.
    tenant_override: false  # Admin-only override
    notes: >
      Applies to tools marked with requires_approval: true.
      Cannot be bypassed - safety critical.

  allow_production_database_writes:
    value: false
    type: boolean
    description: Allow workflows to write to production databases
    rationale: >
      CRITICAL: Prevents accidental production data modification.
      Use read replicas or staging databases for workflows.
    tenant_override: false  # Admin-only override
    notes: >
      Even when true, database write operations require approval.

  # ==========================================================================
  # RATE LIMITING
  # ==========================================================================

  max_executions_per_user_per_hour:
    value: 100
    type: integer
    description: Maximum workflow executions per user per hour
    rationale: >
      Prevents abuse and runaway automation.
      Adjust based on expected usage patterns.
    tenant_override: true
    recommended_range: [50, 500]

  max_api_calls_per_execution:
    value: 100
    type: integer
    description: Maximum external API calls in a single workflow execution
    rationale: >
      Prevents excessive API usage that could hit rate limits or incur costs.
    tenant_override: true
    recommended_range: [50, 200]

  # ==========================================================================
  # ROOM CONSTRAINTS
  # ==========================================================================

  max_room_turns:
    value: 20
    type: integer
    description: Maximum number of turns in a room discussion
    rationale: >
      Prevents endless agent discussions.
      Most room sessions should resolve in 5-10 turns.
    tenant_override: true
    recommended_range: [10, 50]

  max_speakers_per_turn:
    value: 4
    type: integer
    description: Maximum number of agents speaking per turn in rooms
    rationale: >
      Too many speakers per turn creates noise and confusion.
      Prefer focused discussions with 2-3 speakers per turn.
    tenant_override: true
    recommended_range: [2, 6]

  # ==========================================================================
  # STORAGE CONSTRAINTS
  # ==========================================================================

  max_execution_history_days:
    value: 90
    type: integer
    description: How long to retain execution history (days)
    rationale: >
      Balance between audit trail and storage costs.
      Older executions are archived or deleted.
    tenant_override: true
    recommended_range: [30, 365]

  max_output_size_mb:
    value: 10
    type: float
    description: Maximum size of step output (MB)
    rationale: >
      Prevents massive outputs from overwhelming storage.
      Large outputs should be stored externally with references.
    tenant_override: true
    recommended_range: [5, 50]

# =============================================================================
# Constraint Categories
# =============================================================================
#
# Safety Constraints:
#   - unsafe_operations_enabled
#   - dangerous_tools_require_approval
#   - allow_production_database_writes
#   These are security-critical and should rarely be changed.
#
# Resource Constraints:
#   - max_execution_time_minutes
#   - max_cost_per_execution_usd
#   - max_tokens_per_step
#   - max_parallel_for_each
#   These prevent resource exhaustion and control costs.
#
# Architectural Constraints:
#   - max_room_turns
#   These enforce good workflow design patterns.
#
# Usage Constraints:
#   - max_executions_per_user_per_hour
#   - max_api_calls_per_execution
#   These prevent abuse and manage load.
#
# tenant_override Field:
# ----------------------
# true:  Tenants can override this constraint for their workspace
# false: Only system admin can change this (safety-critical)
#
# Sync Behavior:
# --------------
# - Constraints are UPSERTed (updated if exists, created if not)
# - Type validation ensures value matches expected type
# - tenant_override flag determines who can modify in production
# =============================================================================
