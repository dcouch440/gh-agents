<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Editing State</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .back { position: fixed; top: 20px; left: 20px; text-decoration: none; color: #888; font-size: 14px; }
  .back:hover { color: #333; }
  h2 { margin-bottom: 6px; color: #333; font-size: 20px; font-weight: 500; }
  p.sub { margin-bottom: 40px; color: #999; font-size: 14px; }
  .scene { display: flex; gap: 100px; align-items: center; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .demo label { font-size: 13px; color: #888; }
  .demo .desc { font-size: 12px; color: #aaa; max-width: 220px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<h2>Editing</h2>
<p class="sub">User is actively typing or drawing in this node</p>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-a" width="260" height="200"></canvas>
    <label>Variant A — Pencil scratch border</label>
    <div class="desc">The border gets a lively hand-drawn redraw — like a pencil is actively sketching the outline. Subtle but responsive.</div>
  </div>
  <div class="demo">
    <canvas id="canvas-b" width="260" height="200"></canvas>
    <label>Variant B — Warm glow + cursor</label>
    <div class="desc">A soft warm halo around the node with a blinking pencil cursor. The node feels "selected" and alive.</div>
  </div>
</div>

<script>
const RECT = { x: 50, y: 65, w: 160, h: 70, r: 8 };

function rand(min, max) { return min + Math.random() * (max - min); }

function drawNodeBase(ctx, x, y, w, h, r, opts = {}) {
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, w - 2, h - 2, r);
  ctx.fill();
  ctx.restore();
}

function drawHandBorder(ctx, x, y, w, h, r, wobble, alpha, lineWidth) {
  ctx.save();
  ctx.strokeStyle = `rgba(30, 30, 30, ${alpha})`;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x + r + rand(-wobble, wobble), y + rand(-wobble, wobble));
  // Top
  for (let i = 1; i <= 4; i++) ctx.lineTo(x + r + (w-2*r)*(i/4) + rand(-wobble,wobble), y + rand(-wobble,wobble));
  ctx.arcTo(x+w+rand(-wobble,wobble), y+rand(-wobble,wobble), x+w+rand(-wobble,wobble), y+r, r);
  // Right
  for (let i = 1; i <= 3; i++) ctx.lineTo(x+w+rand(-wobble,wobble), y+r+(h-2*r)*(i/3)+rand(-wobble,wobble));
  ctx.arcTo(x+w+rand(-wobble,wobble), y+h+rand(-wobble,wobble), x+w-r, y+h+rand(-wobble,wobble), r);
  // Bottom
  for (let i = 1; i <= 4; i++) ctx.lineTo(x+w-r-(w-2*r)*(i/4)+rand(-wobble,wobble), y+h+rand(-wobble,wobble));
  ctx.arcTo(x+rand(-wobble,wobble), y+h+rand(-wobble,wobble), x+rand(-wobble,wobble), y+h-r, r);
  // Left
  for (let i = 1; i <= 3; i++) ctx.lineTo(x+rand(-wobble,wobble), y+h-r-(h-2*r)*(i/3)+rand(-wobble,wobble));
  ctx.arcTo(x+rand(-wobble,wobble), y+rand(-wobble,wobble), x+r, y+rand(-wobble,wobble), r);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawLabel(ctx, text, x, y, w, h, alpha) {
  ctx.save();
  ctx.font = '16px "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive';
  ctx.fillStyle = `rgba(30, 30, 30, ${alpha || 1})`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
  ctx.restore();
}

// ---- VARIANT A: Pencil scratch border ----
let timeA = 0;

function drawVariantA() {
  const ctx = document.getElementById('canvas-a').getContext('2d');
  ctx.clearRect(0, 0, 260, 200);
  timeA++;

  drawNodeBase(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r);

  // Active sketchy border — redraws with more wobble than normal, like a pencil is going over it
  const activeWobble = 1.5 + Math.sin(timeA * 0.08) * 0.5;
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, activeWobble, 0.8, 1.8);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, activeWobble * 0.7, 0.25, 1.0);

  // Small pencil scratch marks at corners — like the pencil is resting there
  const corners = [
    [RECT.x - 2, RECT.y - 2],
    [RECT.x + RECT.w + 2, RECT.y - 2],
    [RECT.x + RECT.w + 2, RECT.y + RECT.h + 2],
    [RECT.x - 2, RECT.y + RECT.h + 2],
  ];
  ctx.save();
  ctx.strokeStyle = 'rgba(30, 30, 30, 0.15)';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  for (const [cx, cy] of corners) {
    if (Math.random() > 0.5) continue;
    ctx.beginPath();
    ctx.moveTo(cx + rand(-4, 4), cy + rand(-4, 4));
    ctx.lineTo(cx + rand(-4, 4), cy + rand(-4, 4));
    ctx.stroke();
  }
  ctx.restore();

  drawLabel(ctx, 'Worker', RECT.x, RECT.y, RECT.w, RECT.h);

  // Typing indicator — small dots appearing inside the node below label
  const dotY = RECT.y + RECT.h / 2 + 14;
  const dotX = RECT.x + RECT.w / 2;
  const dotPhase = Math.floor(timeA / 20) % 4;
  ctx.save();
  ctx.fillStyle = 'rgba(80, 80, 100, 0.35)';
  for (let i = 0; i < 3; i++) {
    if (i < dotPhase) {
      ctx.beginPath();
      ctx.arc(dotX - 10 + i * 10, dotY, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ---- VARIANT B: Warm glow + cursor ----
let timeB = 0;

function drawVariantB() {
  const ctx = document.getElementById('canvas-b').getContext('2d');
  ctx.clearRect(0, 0, 260, 200);
  timeB++;

  // Warm glow behind the node
  const glowPulse = 0.08 + Math.sin(timeB * 0.04) * 0.03;
  ctx.save();
  ctx.shadowColor = `rgba(255, 180, 80, ${glowPulse})`;
  ctx.shadowBlur = 18 + Math.sin(timeB * 0.04) * 4;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(RECT.x, RECT.y, RECT.w, RECT.h, RECT.r);
  ctx.fill();
  ctx.restore();

  drawNodeBase(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 0.8, 0.85, 1.6);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 0.5, 0.3, 1.0);

  drawLabel(ctx, 'Worker', RECT.x, RECT.y, RECT.w, RECT.h);

  // Blinking pencil cursor
  const cursorBlink = Math.sin(timeB * 0.08) > 0;
  if (cursorBlink) {
    const cursorX = RECT.x + RECT.w / 2 + 30;
    const cursorY = RECT.y + RECT.h / 2;
    ctx.save();
    ctx.strokeStyle = 'rgba(60, 60, 80, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cursorX, cursorY - 8);
    ctx.lineTo(cursorX, cursorY + 8);
    ctx.stroke();
    ctx.restore();
  }

  // Small pencil icon in top-right corner
  const px = RECT.x + RECT.w - 8;
  const py = RECT.y + 8;
  ctx.save();
  ctx.strokeStyle = 'rgba(200, 140, 50, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  // Pencil body
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px - 8, py + 8);
  ctx.stroke();
  // Pencil tip
  ctx.beginPath();
  ctx.moveTo(px - 8, py + 8);
  ctx.lineTo(px - 9.5, py + 11);
  ctx.stroke();
  ctx.restore();
}

function animate() {
  drawVariantA();
  drawVariantB();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
