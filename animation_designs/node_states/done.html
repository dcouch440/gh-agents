<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Done State</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .back { position: fixed; top: 20px; left: 20px; text-decoration: none; color: #888; font-size: 14px; }
  .back:hover { color: #333; }
  h2 { margin-bottom: 6px; color: #333; font-size: 20px; font-weight: 500; }
  p.sub { margin-bottom: 40px; color: #999; font-size: 14px; }
  .scene { display: flex; gap: 100px; align-items: center; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .demo label { font-size: 13px; color: #888; }
  .demo .desc { font-size: 12px; color: #aaa; max-width: 220px; text-align: center; line-height: 1.5; }
  .controls { margin-top: 40px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #f0f0f0; }
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<h2>Done</h2>
<p class="sub">Finished successfully — solid, settled, proud</p>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-a" width="260" height="200"></canvas>
    <label>Variant A — Stamp checkmark</label>
    <div class="desc">A hand-drawn checkmark stamps down with impact, bounces, then settles. The node looks complete and satisfied.</div>
  </div>
  <div class="demo">
    <canvas id="canvas-b" width="260" height="200"></canvas>
    <label>Variant B — Gold star</label>
    <div class="desc">A cartoon gold star appears in the corner with a brief sparkle. Like getting a sticker on your homework.</div>
  </div>
</div>

<div class="controls">
  <button id="btn-restart">Replay</button>
</div>

<script>
const RECT = { x: 50, y: 65, w: 160, h: 70, r: 8 };

function rand(min, max) { return min + Math.random() * (max - min); }

function drawNodeBase(ctx, x, y, w, h, r) {
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, w - 2, h - 2, r);
  ctx.fill();
  ctx.restore();
}

function drawHandBorder(ctx, x, y, w, h, r, wobble, alpha, lineWidth) {
  ctx.save();
  ctx.strokeStyle = `rgba(30, 30, 30, ${alpha})`;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x + r + rand(-wobble,wobble), y + rand(-wobble,wobble));
  for (let i = 1; i <= 4; i++) ctx.lineTo(x+r+(w-2*r)*(i/4)+rand(-wobble,wobble), y+rand(-wobble,wobble));
  ctx.arcTo(x+w+rand(-wobble,wobble), y+rand(-wobble,wobble), x+w+rand(-wobble,wobble), y+r, r);
  for (let i = 1; i <= 3; i++) ctx.lineTo(x+w+rand(-wobble,wobble), y+r+(h-2*r)*(i/3)+rand(-wobble,wobble));
  ctx.arcTo(x+w+rand(-wobble,wobble), y+h+rand(-wobble,wobble), x+w-r, y+h+rand(-wobble,wobble), r);
  for (let i = 1; i <= 4; i++) ctx.lineTo(x+w-r-(w-2*r)*(i/4)+rand(-wobble,wobble), y+h+rand(-wobble,wobble));
  ctx.arcTo(x+rand(-wobble,wobble), y+h+rand(-wobble,wobble), x+rand(-wobble,wobble), y+h-r, r);
  for (let i = 1; i <= 3; i++) ctx.lineTo(x+rand(-wobble,wobble), y+h-r-(h-2*r)*(i/3)+rand(-wobble,wobble));
  ctx.arcTo(x+rand(-wobble,wobble), y+rand(-wobble,wobble), x+r, y+rand(-wobble,wobble), r);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawLabel(ctx, text, x, y, w, h) {
  ctx.save();
  ctx.font = '16px "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive';
  ctx.fillStyle = 'rgba(30, 30, 30, 1)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
  ctx.restore();
}

// Easing function
function easeOutBounce(t) {
  if (t < 1/2.75) return 7.5625*t*t;
  if (t < 2/2.75) { t-=1.5/2.75; return 7.5625*t*t+0.75; }
  if (t < 2.5/2.75) { t-=2.25/2.75; return 7.5625*t*t+0.9375; }
  t-=2.625/2.75; return 7.5625*t*t+0.984375;
}

function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10*t) * Math.sin((t-0.1)*5*Math.PI) + 1;
}

// ---- VARIANT A: Stamp checkmark ----
let progressA = 0;
const ANIM_DURATION_A = 50;

function drawVariantA() {
  const ctx = document.getElementById('canvas-a').getContext('2d');
  ctx.clearRect(0, 0, 260, 200);

  drawNodeBase(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 0.6, 0.85, 1.6);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 0.4, 0.3, 1.0);
  drawLabel(ctx, 'Worker', RECT.x, RECT.y, RECT.w, RECT.h);

  if (progressA <= 0) return;

  const t = Math.min(progressA / ANIM_DURATION_A, 1);

  // Checkmark with bounce-in
  const checkScale = easeOutBounce(Math.min(t * 2, 1));
  const checkAlpha = Math.min(t * 3, 1);

  const cx = RECT.x + RECT.w - 22;
  const cy = RECT.y + 18;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(checkScale, checkScale);

  // Green circle background
  ctx.beginPath();
  ctx.fillStyle = `rgba(80, 180, 100, ${checkAlpha * 0.2})`;
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill();

  // Hand-drawn checkmark
  ctx.strokeStyle = `rgba(60, 160, 80, ${checkAlpha * 0.9})`;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-5 + rand(-0.5,0.5), 1 + rand(-0.5,0.5));
  ctx.lineTo(-1 + rand(-0.5,0.5), 5 + rand(-0.5,0.5));
  ctx.lineTo(6 + rand(-0.5,0.5), -4 + rand(-0.5,0.5));
  ctx.stroke();

  ctx.restore();

  // Impact lines on stamp
  if (t < 0.4) {
    const impactAlpha = (0.4 - t) * 2;
    ctx.save();
    ctx.strokeStyle = `rgba(60, 160, 80, ${impactAlpha * 0.4})`;
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    const spread = 14 + t * 20;
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i + rand(-0.3, 0.3);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (spread - 4), cy + Math.sin(a) * (spread - 4));
      ctx.lineTo(cx + Math.cos(a) * spread, cy + Math.sin(a) * spread);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ---- VARIANT B: Gold star ----
let progressB = 0;
const ANIM_DURATION_B = 60;

function drawStar(ctx, cx, cy, outerR, innerR, points, rotation) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = rotation + (Math.PI * 2 / (points * 2)) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * r + rand(-0.4, 0.4);
    const y = cy + Math.sin(a) * r + rand(-0.4, 0.4);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawVariantB() {
  const ctx = document.getElementById('canvas-b').getContext('2d');
  ctx.clearRect(0, 0, 260, 200);

  drawNodeBase(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 0.6, 0.85, 1.6);
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 0.4, 0.3, 1.0);
  drawLabel(ctx, 'Worker', RECT.x, RECT.y, RECT.w, RECT.h);

  if (progressB <= 0) return;

  const t = Math.min(progressB / ANIM_DURATION_B, 1);

  const starScale = easeOutElastic(Math.min(t * 1.8, 1));
  const starAlpha = Math.min(t * 4, 1);

  const sx = RECT.x + RECT.w - 18;
  const sy = RECT.y + 16;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(starScale, starScale);

  // Star fill
  ctx.fillStyle = `rgba(230, 190, 50, ${starAlpha * 0.85})`;
  ctx.strokeStyle = `rgba(180, 140, 20, ${starAlpha * 0.7})`;
  ctx.lineWidth = 1.5;
  drawStar(ctx, 0, 0, 10, 4.5, 5, rand(-0.05, 0.05));
  ctx.fill();
  ctx.stroke();

  ctx.restore();

  // Sparkle particles
  if (t < 0.6) {
    ctx.save();
    const sparkleCount = 5;
    for (let i = 0; i < sparkleCount; i++) {
      const sa = (Math.PI * 2 / sparkleCount) * i + t * 3;
      const sd = 16 + t * 25;
      const spx = sx + Math.cos(sa) * sd;
      const spy = sy + Math.sin(sa) * sd;
      const sparkAlpha = (0.6 - t) * 1.2;

      ctx.strokeStyle = `rgba(220, 180, 40, ${sparkAlpha})`;
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';

      // Small cross sparkle
      const sz = 3;
      ctx.beginPath();
      ctx.moveTo(spx - sz, spy);
      ctx.lineTo(spx + sz, spy);
      ctx.moveTo(spx, spy - sz);
      ctx.lineTo(spx, spy + sz);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function restart() {
  progressA = 0;
  progressB = 0;
}

let frame = 0;
function animate() {
  progressA++;
  progressB++;
  if (frame % 2 === 0) drawVariantA(); // Redraw at 30fps for hand-drawn feel
  drawVariantB();
  frame++;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-restart').addEventListener('click', restart);
</script>
</body>
</html>
