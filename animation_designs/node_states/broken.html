<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broken State</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .back { position: fixed; top: 20px; left: 20px; text-decoration: none; color: #888; font-size: 14px; }
  .back:hover { color: #333; }
  h2 { margin-bottom: 6px; color: #333; font-size: 20px; font-weight: 500; }
  p.sub { margin-bottom: 40px; color: #999; font-size: 14px; }
  .scene { display: flex; gap: 100px; align-items: center; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .demo label { font-size: 13px; color: #888; }
  .demo .desc { font-size: 12px; color: #aaa; max-width: 220px; text-align: center; line-height: 1.5; }
  .controls { margin-top: 40px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #f0f0f0; }
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<h2>Broken</h2>
<p class="sub">Something went wrong — needs attention</p>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-a" width="260" height="210"></canvas>
    <label>Variant A — Cracked + smoke</label>
    <div class="desc">Cracks spread across the surface with cartoon smoke wisps rising. The node is hurt. Visible across a big canvas.</div>
  </div>
  <div class="demo">
    <canvas id="canvas-b" width="260" height="210"></canvas>
    <label>Variant B — X eyes + dizzy stars</label>
    <div class="desc">Classic cartoon KO — X marks for eyes and little stars circling above. It got bonked. Unmistakable.</div>
  </div>
</div>

<div class="controls">
  <button id="btn-restart">Replay</button>
</div>

<script>
const RECT = { x: 50, y: 75, w: 160, h: 70, r: 8 };

function rand(min, max) { return min + Math.random() * (max - min); }

function drawNodeBase(ctx, x, y, w, h, r, fillColor) {
  ctx.save();
  ctx.fillStyle = fillColor || '#fff';
  ctx.beginPath();
  ctx.roundRect(x + 1, y + 1, w - 2, h - 2, r);
  ctx.fill();
  ctx.restore();
}

function drawHandBorder(ctx, x, y, w, h, r, wobble, color, lineWidth) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x+r+rand(-wobble,wobble), y+rand(-wobble,wobble));
  for (let i=1;i<=4;i++) ctx.lineTo(x+r+(w-2*r)*(i/4)+rand(-wobble,wobble), y+rand(-wobble,wobble));
  ctx.arcTo(x+w+rand(-wobble,wobble), y+rand(-wobble,wobble), x+w+rand(-wobble,wobble), y+r, r);
  for (let i=1;i<=3;i++) ctx.lineTo(x+w+rand(-wobble,wobble), y+r+(h-2*r)*(i/3)+rand(-wobble,wobble));
  ctx.arcTo(x+w+rand(-wobble,wobble), y+h+rand(-wobble,wobble), x+w-r, y+h+rand(-wobble,wobble), r);
  for (let i=1;i<=4;i++) ctx.lineTo(x+w-r-(w-2*r)*(i/4)+rand(-wobble,wobble), y+h+rand(-wobble,wobble));
  ctx.arcTo(x+rand(-wobble,wobble), y+h+rand(-wobble,wobble), x+rand(-wobble,wobble), y+h-r, r);
  for (let i=1;i<=3;i++) ctx.lineTo(x+rand(-wobble,wobble), y+h-r-(h-2*r)*(i/3)+rand(-wobble,wobble));
  ctx.arcTo(x+rand(-wobble,wobble), y+rand(-wobble,wobble), x+r, y+rand(-wobble,wobble), r);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawLabel(ctx, text, x, y, w, h) {
  ctx.save();
  ctx.font = '16px "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive';
  ctx.fillStyle = 'rgba(30, 30, 30, 1)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
  ctx.restore();
}

// ---- VARIANT A: Cracked + smoke ----
let progressA = 0;
const cracksSeeds = [];
for (let i = 0; i < 5; i++) {
  cracksSeeds.push({
    startX: rand(0.2, 0.8),
    startY: rand(0.2, 0.8),
    angle: rand(-Math.PI, Math.PI),
    length: rand(15, 40),
    branches: Math.floor(rand(0, 3)),
  });
}

const smokeParticles = [];

function drawVariantA() {
  const ctx = document.getElementById('canvas-a').getContext('2d');
  ctx.clearRect(0, 0, 260, 210);

  // Slightly reddish tint when broken
  const tintAlpha = Math.min(progressA / 30, 1) * 0.08;
  drawNodeBase(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, `rgba(255, 230, 225, ${0.9 + tintAlpha})`);

  // Border in red-tinted color
  const borderAlpha = 0.85;
  const redMix = Math.min(progressA / 40, 1);
  const r = Math.floor(30 + 150 * redMix);
  const g = Math.floor(30 * (1 - redMix * 0.5));
  const b = Math.floor(30 * (1 - redMix * 0.5));
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 1.0, `rgba(${r},${g},${b},${borderAlpha})`, 1.6);

  drawLabel(ctx, 'Worker', RECT.x, RECT.y, RECT.w, RECT.h);

  // Cracks
  const crackProgress = Math.min(progressA / 25, 1);
  if (crackProgress > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(160, 50, 40, ${crackProgress * 0.5})`;
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';

    for (const crack of cracksSeeds) {
      const sx = RECT.x + RECT.w * crack.startX;
      const sy = RECT.y + RECT.h * crack.startY;
      const len = crack.length * crackProgress;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      let cx = sx, cy = sy;
      const steps = 4;
      for (let i = 0; i < steps; i++) {
        const segLen = len / steps;
        const a = crack.angle + rand(-0.4, 0.4);
        cx += Math.cos(a) * segLen;
        cy += Math.sin(a) * segLen;
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();

      // Branches
      if (crackProgress > 0.5) {
        for (let b = 0; b < crack.branches; b++) {
          const bt = rand(0.3, 0.7);
          const bx = sx + (cx - sx) * bt;
          const by = sy + (cy - sy) * bt;
          const ba = crack.angle + rand(-1.2, 1.2);
          const bl = len * 0.3 * (crackProgress - 0.5) * 2;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + Math.cos(ba) * bl, by + Math.sin(ba) * bl);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  // Smoke wisps
  if (progressA > 15 && progressA % 12 === 0 && smokeParticles.length < 6) {
    smokeParticles.push({
      x: RECT.x + rand(20, RECT.w - 20),
      y: RECT.y - 2,
      size: rand(4, 8),
      opacity: 0.3,
      vx: rand(-0.2, 0.2),
      vy: rand(-0.4, -0.8),
    });
  }

  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const s = smokeParticles[i];
    s.x += s.vx;
    s.y += s.vy;
    s.size += 0.08;
    s.opacity -= 0.003;
    if (s.opacity <= 0) { smokeParticles.splice(i, 1); continue; }

    ctx.save();
    ctx.fillStyle = `rgba(100, 80, 70, ${s.opacity})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ---- VARIANT B: X eyes + dizzy stars ----
let progressB = 0;
let timeB = 0;

function drawVariantB() {
  const ctx = document.getElementById('canvas-b').getContext('2d');
  ctx.clearRect(0, 0, 260, 210);
  timeB++;

  drawNodeBase(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 'rgba(255, 235, 230, 0.95)');
  drawHandBorder(ctx, RECT.x, RECT.y, RECT.w, RECT.h, RECT.r, 1.0, 'rgba(180, 50, 40, 0.7)', 1.6);

  drawLabel(ctx, 'Worker', RECT.x, RECT.y, RECT.w, RECT.h);

  const introT = Math.min(progressB / 20, 1);
  if (introT <= 0) return;

  const cx = RECT.x + RECT.w / 2;

  // X eyes
  ctx.save();
  const eyeAlpha = introT * 0.5;
  ctx.strokeStyle = `rgba(180, 50, 40, ${eyeAlpha})`;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  const eyeY = RECT.y + 22;
  const eyeSize = 5 * introT;

  // Left X
  ctx.beginPath();
  ctx.moveTo(cx - 20 - eyeSize, eyeY - eyeSize);
  ctx.lineTo(cx - 20 + eyeSize, eyeY + eyeSize);
  ctx.moveTo(cx - 20 + eyeSize, eyeY - eyeSize);
  ctx.lineTo(cx - 20 - eyeSize, eyeY + eyeSize);
  ctx.stroke();

  // Right X
  ctx.beginPath();
  ctx.moveTo(cx + 20 - eyeSize, eyeY - eyeSize);
  ctx.lineTo(cx + 20 + eyeSize, eyeY + eyeSize);
  ctx.moveTo(cx + 20 + eyeSize, eyeY - eyeSize);
  ctx.lineTo(cx + 20 - eyeSize, eyeY + eyeSize);
  ctx.stroke();

  ctx.restore();

  // Dizzy stars circling above
  if (introT >= 1) {
    ctx.save();
    const starCount = 3;
    const orbitR = 25;
    const orbitY = RECT.y - 12;

    for (let i = 0; i < starCount; i++) {
      const angle = timeB * 0.05 + (Math.PI * 2 / starCount) * i;
      const sx = cx + Math.cos(angle) * orbitR;
      const sy = orbitY + Math.sin(angle) * 8; // Flattened orbit

      // Four-point star
      const sz = 4 + Math.sin(timeB * 0.1 + i * 2) * 1;
      ctx.fillStyle = `rgba(220, 180, 40, ${0.5 + Math.sin(timeB * 0.08 + i) * 0.15})`;
      ctx.beginPath();
      for (let p = 0; p < 8; p++) {
        const pr = p % 2 === 0 ? sz : sz * 0.35;
        const pa = (Math.PI * 2 / 8) * p + timeB * 0.03;
        const px = sx + Math.cos(pa) * pr;
        const py = sy + Math.sin(pa) * pr;
        if (p === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function restart() {
  progressA = 0;
  progressB = 0;
  smokeParticles.length = 0;
}

let frame = 0;
function animate() {
  progressA++;
  progressB++;
  if (frame % 3 === 0) drawVariantA();
  drawVariantB();
  frame++;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-restart').addEventListener('click', restart);
</script>
</body>
</html>
