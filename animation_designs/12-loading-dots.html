<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading Dots — Initializing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive;
  }
  h2 { margin-bottom: 8px; color: #333; font-size: 18px; }
  p.sub { margin-bottom: 30px; color: #888; font-size: 13px; }
  .scene { display: flex; gap: 100px; align-items: flex-end; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .demo label { font-size: 14px; color: #666; }
  .controls { margin-top: 40px; display: flex; gap: 16px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #e8e0d0; }
  .controls button.active { background: #333; color: #fff; }
</style>
</head>
<body>

<h2>Loading Dots</h2>
<p class="sub">Classic cartoon thought-bubble dots, bouncing and appearing</p>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-bounce" width="260" height="220"></canvas>
    <label>Bounce — up and down</label>
  </div>
  <div class="demo">
    <canvas id="canvas-typewriter" width="260" height="220"></canvas>
    <label>Typewriter — tap tap tap</label>
  </div>
  <div class="demo">
    <canvas id="canvas-thought" width="260" height="220"></canvas>
    <label>Thought bubble — trailing</label>
  </div>
</div>

<div class="controls">
  <button id="btn-restart" class="active">Restart</button>
  <button id="btn-speed-slow">Slow</button>
  <button id="btn-speed-normal" class="active">Normal</button>
  <button id="btn-speed-fast">Fast</button>
</div>

<script>
const RECT = { x: 50, y: 70, w: 160, h: 80 };
let speedMult = 1.0;

function rand(min, max) { return min + Math.random() * (max - min); }

function drawSketchyRect(ctx, x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    const edges = [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];
    for (const [x1,y1,x2,y2] of edges) {
      ctx.moveTo(x1+rand(-1.5,1.5), y1+rand(-1.5,1.5));
      for (let i = 1; i <= 5; i++) {
        const t = i/5;
        ctx.lineTo(x1+(x2-x1)*t+rand(-1,1), y1+(y2-y1)*t+rand(-1,1));
      }
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255, 240, 220, 0.25)';
  ctx.fillRect(x+2, y+2, w-4, h-4);
  ctx.restore();
}

// ---- BOUNCE DOTS ----
class BounceAnimation {
  constructor(canvasId) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.time = 0;
  }
  reset() { this.time = 0; }
  update() { this.time += 0.06 * speedMult; }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);

    const cx = RECT.x + RECT.w / 2;
    const baseY = RECT.y + RECT.h / 2 + 4;
    const dotCount = 3;
    const spacing = 18;
    const startX = cx - (dotCount - 1) * spacing / 2;

    for (let i = 0; i < dotCount; i++) {
      const phase = this.time - i * 0.5;
      const bounce = Math.max(0, Math.sin(phase)) * 10;
      const squash = bounce > 0 ? 1 - bounce / 30 : 1;
      const stretch = bounce > 0 ? 1 + bounce / 40 : 1;
      const dotR = 5;

      const dx = startX + i * spacing;
      const dy = baseY - bounce;

      ctx.save();
      ctx.translate(dx, dy);
      ctx.scale(1 + (1 - squash) * 0.3, stretch);

      // Hand-drawn dot
      ctx.fillStyle = `rgba(60, 60, 80, ${0.5 + bounce / 20})`;
      ctx.strokeStyle = `rgba(40, 40, 60, 0.6)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let s = 0; s <= 8; s++) {
        const a = (Math.PI * 2 / 8) * s;
        const r = dotR + rand(-0.8, 0.8);
        if (s === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Shadow at base
      if (bounce > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(0, 0, 0, ${0.08 * (1 - bounce / 12)})`;
        ctx.beginPath();
        ctx.ellipse(dx, baseY + 5, dotR * (1.2 - bounce / 30), 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

// ---- TYPEWRITER DOTS ----
class TypewriterAnimation {
  constructor(canvasId) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.time = 0;
  }
  reset() { this.time = 0; }
  update() { this.time += 0.03 * speedMult; }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);

    const cx = RECT.x + RECT.w / 2;
    const baseY = RECT.y + RECT.h / 2 + 2;
    const dotCount = 3;
    const spacing = 16;
    const startX = cx - (dotCount - 1) * spacing / 2;

    // Cycle: dots appear one by one, then all disappear, repeat
    const cycleDuration = 4; // in time units
    const cyclePos = this.time % cycleDuration;
    const dotAppearInterval = 0.8;

    for (let i = 0; i < dotCount; i++) {
      const dotAppearTime = i * dotAppearInterval;
      const dotAge = cyclePos - dotAppearTime;

      if (dotAge < 0 || cyclePos > dotCount * dotAppearInterval + 0.8) continue;

      // Stamp effect — dot appears with a slight "impact"
      const impactPhase = Math.min(dotAge / 0.15, 1);
      const scale = impactPhase < 1 ? 1.3 - impactPhase * 0.3 : 1;

      const dx = startX + i * spacing;

      ctx.save();
      ctx.translate(dx, baseY);
      ctx.scale(scale, scale);

      ctx.fillStyle = `rgba(50, 50, 70, 0.7)`;
      ctx.strokeStyle = `rgba(30, 30, 50, 0.5)`;
      ctx.lineWidth = 1.5;

      // Slightly messy dot
      ctx.beginPath();
      const r = 4;
      for (let s = 0; s <= 8; s++) {
        const a = (Math.PI * 2 / 8) * s;
        const wr = r + rand(-0.6, 0.6);
        if (s === 0) ctx.moveTo(Math.cos(a) * wr, Math.sin(a) * wr);
        else ctx.lineTo(Math.cos(a) * wr, Math.sin(a) * wr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Impact marks on stamp
      if (impactPhase < 0.5) {
        ctx.strokeStyle = `rgba(50, 50, 70, ${0.3 * (1 - impactPhase * 2)})`;
        ctx.lineWidth = 1;
        for (let m = 0; m < 3; m++) {
          const ma = rand(0, Math.PI * 2);
          ctx.beginPath();
          ctx.moveTo(Math.cos(ma) * (r + 2), Math.sin(ma) * (r + 2));
          ctx.lineTo(Math.cos(ma) * (r + 6), Math.sin(ma) * (r + 6));
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // Cursor blink after last dot
    const cursorX = startX + dotCount * spacing;
    const blink = Math.sin(this.time * 4) > 0;
    if (blink) {
      ctx.save();
      ctx.strokeStyle = `rgba(50, 50, 70, 0.5)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cursorX, baseY - 7);
      ctx.lineTo(cursorX, baseY + 7);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---- THOUGHT BUBBLE DOTS ----
class ThoughtAnimation {
  constructor(canvasId) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.time = 0;
  }
  reset() { this.time = 0; }
  update() { this.time += 0.04 * speedMult; }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);

    // Thought bubble dots trailing upward from top-right corner
    const startX = RECT.x + RECT.w - 20;
    const startY = RECT.y - 5;

    const dots = [
      { dx: 0, dy: 0, r: 4 },
      { dx: 8, dy: -12, r: 6 },
      { dx: 14, dy: -28, r: 9 },
    ];

    // Pulsing — each dot pulses in sequence
    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      const phase = this.time - i * 0.6;
      const pulse = 1 + Math.sin(phase * 2) * 0.2;
      const alpha = 0.3 + Math.sin(phase * 2) * 0.15 + 0.15;

      const dx = startX + d.dx;
      const dy = startY + d.dy + Math.sin(phase) * 2;
      const r = d.r * pulse;

      // Bumpy cloud shape
      ctx.save();
      ctx.fillStyle = `rgba(240, 235, 225, ${alpha})`;
      ctx.strokeStyle = `rgba(80, 80, 90, ${alpha * 0.8})`;
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      const bumps = i === 2 ? 6 : 4;
      for (let b = 0; b <= bumps; b++) {
        const a = (Math.PI * 2 / bumps) * b;
        const br = r * (0.75 + rand(-0.1, 0.1));
        const bx = dx + Math.cos(a) * r * 0.3;
        const by = dy + Math.sin(a) * r * 0.3;
        if (b === 0) ctx.moveTo(bx + br, by);
        ctx.arc(bx, by, br, a, a + Math.PI * 2 / bumps + 0.1);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Label
    ctx.save();
    ctx.font = '14px "Comic Sans MS", cursive';
    ctx.fillStyle = `rgba(85, 85, 85, 0.8)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Thinking...', RECT.x + RECT.w/2, RECT.y + RECT.h/2);
    ctx.restore();
  }
}

const anims = [
  new BounceAnimation('canvas-bounce'),
  new TypewriterAnimation('canvas-typewriter'),
  new ThoughtAnimation('canvas-thought'),
];

function restartAll() { for (const a of anims) a.reset(); }

let lastFrame = 0;
function animate(ts) {
  if (ts - lastFrame >= 30) {
    for (const a of anims) { a.update(); a.draw(); }
    lastFrame = ts;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-restart').addEventListener('click', restartAll);
[['btn-speed-slow', 0.4], ['btn-speed-normal', 1.0], ['btn-speed-fast', 2.5]].forEach(([id, s]) => {
  document.getElementById(id).addEventListener('click', function() {
    speedMult = s;
    document.querySelectorAll('.controls button:not(#btn-restart)').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
</body>
</html>
