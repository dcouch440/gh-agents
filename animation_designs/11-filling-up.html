<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Filling Up — Initializing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive;
  }
  h2 { margin-bottom: 8px; color: #333; font-size: 18px; }
  p.sub { margin-bottom: 30px; color: #888; font-size: 13px; }
  .scene { display: flex; gap: 100px; align-items: flex-end; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .demo label { font-size: 14px; color: #666; }
  .controls { margin-top: 40px; display: flex; gap: 16px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #e8e0d0; }
  .controls button.active { background: #333; color: #fff; }
</style>
</head>
<body>

<h2>Filling Up</h2>
<p class="sub">The rectangle fills from bottom to top like a container being loaded</p>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-liquid" width="260" height="220"></canvas>
    <label>Liquid — wavy surface</label>
  </div>
  <div class="demo">
    <canvas id="canvas-scanlines" width="260" height="220"></canvas>
    <label>Scan lines — digital load</label>
  </div>
  <div class="demo">
    <canvas id="canvas-ink" width="260" height="220"></canvas>
    <label>Ink bleed — organic spread</label>
  </div>
</div>

<div class="controls">
  <button id="btn-restart" class="active">Restart</button>
  <button id="btn-speed-slow">Slow</button>
  <button id="btn-speed-normal" class="active">Normal</button>
  <button id="btn-speed-fast">Fast</button>
</div>

<script>
const RECT = { x: 50, y: 70, w: 160, h: 80 };
let speedMult = 1.0;

function rand(min, max) { return min + Math.random() * (max - min); }

function drawSketchyRect(ctx, x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    const edges = [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];
    for (const [x1,y1,x2,y2] of edges) {
      ctx.moveTo(x1+rand(-1.5,1.5), y1+rand(-1.5,1.5));
      for (let i = 1; i <= 5; i++) {
        const t = i/5;
        ctx.lineTo(x1+(x2-x1)*t+rand(-1,1), y1+(y2-y1)*t+rand(-1,1));
      }
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawLabel(ctx, text, alpha) {
  ctx.save();
  ctx.font = '14px "Comic Sans MS", cursive';
  ctx.fillStyle = `rgba(85, 85, 85, ${alpha})`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, RECT.x + RECT.w/2, RECT.y + RECT.h/2);
  ctx.restore();
}

// ---- LIQUID ----
class LiquidAnimation {
  constructor(canvasId) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.progress = 0;
    this.done = false;
    this.time = 0;
  }
  reset() { this.progress = 0; this.done = false; this.time = 0; }
  update() {
    if (this.done) return;
    this.progress += 0.5 * speedMult;
    this.time += speedMult;
    if (this.progress >= 100) { this.progress = 100; this.done = true; }
  }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);

    const p = this.progress / 100;
    const fillH = RECT.h * p;
    const fillY = RECT.y + RECT.h - fillH;

    // Clip to rect interior
    ctx.save();
    ctx.beginPath();
    ctx.rect(RECT.x + 2, RECT.y + 2, RECT.w - 4, RECT.h - 4);
    ctx.clip();

    // Wavy surface
    ctx.beginPath();
    const waveAmp = this.done ? 0 : 3 + (1 - p) * 4;
    ctx.moveTo(RECT.x, fillY);
    for (let x = RECT.x; x <= RECT.x + RECT.w; x += 3) {
      const wave = Math.sin((x - RECT.x) * 0.08 + this.time * 0.1) * waveAmp;
      const wave2 = Math.sin((x - RECT.x) * 0.12 + this.time * 0.07) * waveAmp * 0.5;
      ctx.lineTo(x, fillY + wave + wave2);
    }
    ctx.lineTo(RECT.x + RECT.w, RECT.y + RECT.h + 5);
    ctx.lineTo(RECT.x, RECT.y + RECT.h + 5);
    ctx.closePath();

    // Gradient fill
    const grad = ctx.createLinearGradient(0, fillY, 0, RECT.y + RECT.h);
    grad.addColorStop(0, `rgba(100, 160, 220, 0.35)`);
    grad.addColorStop(1, `rgba(60, 120, 200, 0.5)`);
    ctx.fillStyle = grad;
    ctx.fill();

    // Surface highlight
    ctx.strokeStyle = `rgba(80, 140, 200, 0.4)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = RECT.x + 3; x <= RECT.x + RECT.w - 3; x += 3) {
      const wave = Math.sin((x - RECT.x) * 0.08 + this.time * 0.1) * waveAmp;
      const wave2 = Math.sin((x - RECT.x) * 0.12 + this.time * 0.07) * waveAmp * 0.5;
      if (x === RECT.x + 3) ctx.moveTo(x, fillY + wave + wave2);
      else ctx.lineTo(x, fillY + wave + wave2);
    }
    ctx.stroke();

    ctx.restore();

    // Bubbles
    if (!this.done && p > 0.1) {
      ctx.save();
      const bubbleCount = Math.floor(p * 5);
      for (let i = 0; i < bubbleCount; i++) {
        const bx = RECT.x + 10 + ((this.time * 3 + i * 37) % (RECT.w - 20));
        const by = fillY + 5 + ((this.time * 2 + i * 23) % (fillH - 10));
        const br = 1.5 + Math.sin(this.time * 0.2 + i) * 0.5;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(150, 200, 255, 0.4)`;
        ctx.lineWidth = 1;
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    const pctText = this.done ? 'Ready' : `${Math.floor(this.progress)}%`;
    drawLabel(ctx, pctText, this.done ? 1 : 0.7);
  }
}

// ---- SCAN LINES ----
class ScanlineAnimation {
  constructor(canvasId) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.progress = 0;
    this.done = false;
    this.scanY = 0;
  }
  reset() { this.progress = 0; this.done = false; this.scanY = 0; }
  update() {
    if (this.done) return;
    this.progress += 0.6 * speedMult;
    if (this.progress >= 100) { this.progress = 100; this.done = true; }
  }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);

    const p = this.progress / 100;
    const fillH = Math.floor(RECT.h * p);

    ctx.save();
    ctx.beginPath();
    ctx.rect(RECT.x + 2, RECT.y + 2, RECT.w - 4, RECT.h - 4);
    ctx.clip();

    // Filled scan lines from bottom
    const lineH = 3;
    const startY = RECT.y + RECT.h;
    for (let y = startY; y > startY - fillH; y -= lineH) {
      const lineAlpha = 0.15 + Math.random() * 0.1;
      ctx.fillStyle = `rgba(60, 180, 100, ${lineAlpha})`;
      ctx.fillRect(RECT.x + 2, y - lineH, RECT.w - 4, lineH - 1);
    }

    // Active scan line (bright)
    if (!this.done) {
      const scanLineY = startY - fillH;
      ctx.fillStyle = `rgba(80, 220, 120, 0.6)`;
      ctx.fillRect(RECT.x + 2, scanLineY - 2, RECT.w - 4, 2);

      // Glow above scan line
      const glowGrad = ctx.createLinearGradient(0, scanLineY - 10, 0, scanLineY);
      glowGrad.addColorStop(0, `rgba(80, 220, 120, 0)`);
      glowGrad.addColorStop(1, `rgba(80, 220, 120, 0.15)`);
      ctx.fillStyle = glowGrad;
      ctx.fillRect(RECT.x + 2, scanLineY - 10, RECT.w - 4, 10);
    }

    ctx.restore();

    const pctText = this.done ? 'Ready' : `${Math.floor(this.progress)}%`;
    drawLabel(ctx, pctText, this.done ? 1 : 0.7);
  }
}

// ---- INK BLEED ----
class InkAnimation {
  constructor(canvasId) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.progress = 0;
    this.done = false;
    this.blots = [];
    this.seeded = false;
  }
  reset() { this.progress = 0; this.done = false; this.blots = []; this.seeded = false; }
  seedBlots() {
    // Seed ink drip starting points along bottom edge
    for (let i = 0; i < 6; i++) {
      this.blots.push({
        x: RECT.x + 15 + (RECT.w - 30) * (i / 5),
        y: RECT.y + RECT.h - 5,
        r: rand(8, 16),
        maxR: rand(20, 40),
        vy: -rand(0.3, 0.8),
        vx: rand(-0.2, 0.2),
        children: [],
      });
    }
    this.seeded = true;
  }
  update() {
    if (this.done) return;
    if (!this.seeded) this.seedBlots();

    this.progress += 0.5 * speedMult;
    if (this.progress >= 100) { this.progress = 100; this.done = true; }

    const p = this.progress / 100;

    for (const b of this.blots) {
      b.r = Math.min(b.r + 0.15 * speedMult, b.maxR * p);
      b.y += b.vy * speedMult;
      b.x += b.vx * speedMult;

      // Spawn children occasionally
      if (Math.random() < 0.02 * speedMult && b.children.length < 3 && p > 0.2) {
        b.children.push({
          x: b.x + rand(-15, 15),
          y: b.y + rand(-10, 5),
          r: rand(4, 10),
          maxR: rand(12, 25),
        });
      }

      for (const c of b.children) {
        c.r = Math.min(c.r + 0.1 * speedMult, c.maxR * p);
      }
    }
  }
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);

    ctx.save();
    ctx.beginPath();
    ctx.rect(RECT.x + 2, RECT.y + 2, RECT.w - 4, RECT.h - 4);
    ctx.clip();

    for (const b of this.blots) {
      // Main blot
      ctx.beginPath();
      ctx.fillStyle = `rgba(40, 40, 60, 0.12)`;
      // Organic shape — wobbly circle
      const steps = 12;
      for (let i = 0; i <= steps; i++) {
        const a = (Math.PI * 2 / steps) * i;
        const wobbleR = b.r * (0.8 + Math.sin(a * 3 + b.x) * 0.2);
        const px = b.x + Math.cos(a) * wobbleR;
        const py = b.y + Math.sin(a) * wobbleR;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // Children
      for (const c of b.children) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(40, 40, 60, 0.1)`;
        for (let i = 0; i <= 10; i++) {
          const a = (Math.PI * 2 / 10) * i;
          const wr = c.r * (0.85 + Math.sin(a * 2 + c.x) * 0.15);
          const px = c.x + Math.cos(a) * wr;
          const py = c.y + Math.sin(a) * wr;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }
    }

    ctx.restore();

    const pctText = this.done ? 'Ready' : `${Math.floor(this.progress)}%`;
    drawLabel(ctx, pctText, this.done ? 1 : 0.7);
  }
}

const anims = [
  new LiquidAnimation('canvas-liquid'),
  new ScanlineAnimation('canvas-scanlines'),
  new InkAnimation('canvas-ink'),
];

function restartAll() { for (const a of anims) a.reset(); }

let lastFrame = 0;
function animate(ts) {
  if (ts - lastFrame >= 30) {
    for (const a of anims) { a.update(); a.draw(); }
    lastFrame = ts;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-restart').addEventListener('click', restartAll);
[['btn-speed-slow', 0.4], ['btn-speed-normal', 1.0], ['btn-speed-fast', 2.5]].forEach(([id, s]) => {
  document.getElementById(id).addEventListener('click', function() {
    speedMult = s;
    document.querySelectorAll('.controls button:not(#btn-restart)').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
</body>
</html>
