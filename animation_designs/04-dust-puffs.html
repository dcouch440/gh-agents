<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dust Puffs Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive;
  }
  h2 { margin-bottom: 30px; color: #333; font-size: 18px; }
  .scene { display: flex; gap: 120px; align-items: flex-end; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .demo label { font-size: 14px; color: #666; }
  .controls { margin-top: 40px; display: flex; gap: 16px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #e8e0d0; }
  .controls button.active { background: #333; color: #fff; }
</style>
</head>
<body>

<h2>Dust Puffs / Cartoon Smoke Clouds</h2>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-subtle" width="260" height="260"></canvas>
    <label>Subtle</label>
  </div>
  <div class="demo">
    <canvas id="canvas-medium" width="260" height="260"></canvas>
    <label>Medium</label>
  </div>
  <div class="demo">
    <canvas id="canvas-intense" width="260" height="260"></canvas>
    <label>Intense</label>
  </div>
</div>

<div class="controls">
  <button id="btn-toggle" class="active">Running</button>
  <button id="btn-speed-slow">Slow</button>
  <button id="btn-speed-normal" class="active">Normal</button>
  <button id="btn-speed-fast">Fast</button>
</div>

<script>
const RECT = { x: 50, y: 130, w: 160, h: 80 };
let running = true;
let speed = 60;

const PRESETS = {
  subtle:  { maxPuffs: 4,  sizeRange: [6, 14],  opacity: 0.25, riseSpeed: 0.8, spawnRate: 0.03 },
  medium:  { maxPuffs: 8,  sizeRange: [8, 20],  opacity: 0.35, riseSpeed: 1.0, spawnRate: 0.06 },
  intense: { maxPuffs: 14, sizeRange: [10, 26], opacity: 0.45, riseSpeed: 1.3, spawnRate: 0.10 },
};

function rand(min, max) { return min + Math.random() * (max - min); }

// Particle system per canvas
const particleSets = { subtle: [], medium: [], intense: [] };

function spawnPuff(preset, presetName) {
  const puffs = particleSets[presetName];
  if (puffs.length >= preset.maxPuffs) return;

  const size = rand(preset.sizeRange[0], preset.sizeRange[1]);
  puffs.push({
    x: RECT.x + rand(10, RECT.w - 10),
    y: RECT.y - rand(2, 8),
    size,
    maxSize: size * (1.5 + Math.random() * 0.8),
    opacity: preset.opacity * (0.6 + Math.random() * 0.4),
    vx: rand(-0.3, 0.3),
    vy: -preset.riseSpeed * (0.7 + Math.random() * 0.6),
    life: 1.0,
    decay: 0.008 + Math.random() * 0.012,
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleSpeed: rand(0.03, 0.08),
    bumps: 4 + Math.floor(Math.random() * 4), // bumpy cloud shape
  });
}

function updatePuffs(presetName) {
  const puffs = particleSets[presetName];
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.x += p.vx + Math.sin(p.wobblePhase) * 0.4;
    p.y += p.vy;
    p.wobblePhase += p.wobbleSpeed;
    p.life -= p.decay;
    p.size += (p.maxSize - p.size) * 0.03; // grow slowly

    if (p.life <= 0) puffs.splice(i, 1);
  }
}

function drawSketchyRect(ctx, x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    const edges = [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];
    for (const [x1,y1,x2,y2] of edges) {
      ctx.moveTo(x1+rand(-1.5,1.5), y1+rand(-1.5,1.5));
      for (let i = 1; i <= 5; i++) {
        const t = i/5;
        ctx.lineTo(x1+(x2-x1)*t+rand(-1,1), y1+(y2-y1)*t+rand(-1,1));
      }
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(240, 230, 210, 0.3)';
  ctx.fillRect(x+2, y+2, w-4, h-4);
  ctx.restore();
}

function drawLabel(ctx, text) {
  ctx.save();
  ctx.font = '14px "Comic Sans MS", cursive';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, RECT.x + RECT.w/2, RECT.y + RECT.h/2);
  ctx.restore();
}

// Draw a bumpy cloud puff
function drawPuff(ctx, p) {
  ctx.save();
  const alpha = p.opacity * p.life;
  ctx.strokeStyle = `rgba(100, 90, 70, ${alpha})`;
  ctx.fillStyle = `rgba(220, 210, 190, ${alpha * 0.4})`;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';

  ctx.beginPath();
  // Draw bumpy circle using overlapping arcs
  for (let i = 0; i < p.bumps; i++) {
    const angle = (Math.PI * 2 / p.bumps) * i;
    const bumpSize = p.size * (0.5 + Math.random() * 0.3);
    const bx = p.x + Math.cos(angle) * p.size * 0.35;
    const by = p.y + Math.sin(angle) * p.size * 0.3;

    ctx.moveTo(bx + bumpSize, by);
    ctx.arc(bx, by, bumpSize, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

const canvases = [
  { id: 'canvas-subtle',  preset: 'subtle',  label: 'LLM Call' },
  { id: 'canvas-medium',  preset: 'medium',  label: 'Agent' },
  { id: 'canvas-intense', preset: 'intense', label: 'Pipeline' },
];
const contexts = canvases.map(c => ({ ctx: document.getElementById(c.id).getContext('2d'), ...c }));

function renderFrame() {
  for (const { ctx, preset: presetName, label } of contexts) {
    const preset = PRESETS[presetName];
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);
    drawLabel(ctx, label);

    if (running) {
      if (Math.random() < preset.spawnRate) spawnPuff(preset, presetName);
      updatePuffs(presetName);
      for (const p of particleSets[presetName]) drawPuff(ctx, p);
    }
  }
}

let lastFrame = 0;
function animate(ts) {
  if (ts - lastFrame >= speed) { renderFrame(); lastFrame = ts; }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-toggle').addEventListener('click', function() {
  running = !running;
  this.textContent = running ? 'Running' : 'Stopped';
  this.classList.toggle('active', running);
});
[['btn-speed-slow',120],['btn-speed-normal',60],['btn-speed-fast',25]].forEach(([id,ms]) => {
  document.getElementById(id).addEventListener('click', function() {
    speed = ms;
    document.querySelectorAll('.controls button:not(#btn-toggle)').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
</body>
</html>
