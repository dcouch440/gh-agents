<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heat Waves Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive;
  }
  h2 { margin-bottom: 30px; color: #333; font-size: 18px; }
  .scene { display: flex; gap: 120px; align-items: flex-end; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .demo label { font-size: 14px; color: #666; }
  .controls { margin-top: 40px; display: flex; gap: 16px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #e8e0d0; }
  .controls button.active { background: #333; color: #fff; }
</style>
</head>
<body>

<h2>Heat Waves / Rising Shimmer</h2>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-subtle" width="240" height="240"></canvas>
    <label>Subtle</label>
  </div>
  <div class="demo">
    <canvas id="canvas-medium" width="240" height="240"></canvas>
    <label>Medium</label>
  </div>
  <div class="demo">
    <canvas id="canvas-intense" width="240" height="240"></canvas>
    <label>Intense</label>
  </div>
</div>

<div class="controls">
  <button id="btn-toggle" class="active">Running</button>
  <button id="btn-speed-slow">Slow</button>
  <button id="btn-speed-normal" class="active">Normal</button>
  <button id="btn-speed-fast">Fast</button>
</div>

<script>
const RECT = { x: 40, y: 130, w: 160, h: 80 };
let running = true;
let speed = 50;
let time = 0;

const PRESETS = {
  subtle:  { waves: 3, amplitude: 6,  height: 40, opacity: 0.2, strokeW: 1.2 },
  medium:  { waves: 5, amplitude: 10, height: 60, opacity: 0.35, strokeW: 1.5 },
  intense: { waves: 7, amplitude: 14, height: 80, opacity: 0.45, strokeW: 2.0 },
};

function rand(min, max) { return min + Math.random() * (max - min); }

function drawSketchyRect(ctx, x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    const edges = [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];
    for (const [x1,y1,x2,y2] of edges) {
      ctx.moveTo(x1+rand(-1.5,1.5), y1+rand(-1.5,1.5));
      for (let i = 1; i <= 5; i++) {
        const t = i/5;
        ctx.lineTo(x1+(x2-x1)*t+rand(-1,1), y1+(y2-y1)*t+rand(-1,1));
      }
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255, 230, 200, 0.25)';
  ctx.fillRect(x+2, y+2, w-4, h-4);
  ctx.restore();
}

function drawLabel(ctx, text) {
  ctx.save();
  ctx.font = '14px "Comic Sans MS", cursive';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, RECT.x + RECT.w/2, RECT.y + RECT.h/2);
  ctx.restore();
}

function drawHeatWaves(ctx, preset, t) {
  ctx.save();

  const waveSpacing = RECT.w / (preset.waves + 1);

  for (let i = 0; i < preset.waves; i++) {
    const baseX = RECT.x + waveSpacing * (i + 1);
    const phase = t * 0.04 + i * 1.3; // each wave has different phase
    const riseOffset = (t * 0.3 + i * 17) % (preset.height + 10);

    // Fade out as it rises
    const fadeFactor = 1 - (riseOffset / (preset.height + 10));
    const alpha = preset.opacity * fadeFactor;
    if (alpha < 0.03) continue;

    ctx.beginPath();
    ctx.strokeStyle = `rgba(200, 80, 30, ${alpha})`;
    ctx.lineWidth = preset.strokeW * fadeFactor;
    ctx.lineCap = 'round';

    const startY = RECT.y - riseOffset;
    const waveHeight = 20 + preset.height * 0.3;

    // Smooth sine wave going upward
    const steps = 20;
    for (let s = 0; s <= steps; s++) {
      const st = s / steps;
      const wy = startY - st * waveHeight;
      const wx = baseX + Math.sin(phase + st * Math.PI * 2.5) * preset.amplitude * (1 - st * 0.5);

      if (s === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
  }

  ctx.restore();
}

const canvases = [
  { id: 'canvas-subtle',  preset: 'subtle',  label: 'LLM Call' },
  { id: 'canvas-medium',  preset: 'medium',  label: 'Agent' },
  { id: 'canvas-intense', preset: 'intense', label: 'Pipeline' },
];
const contexts = canvases.map(c => ({ ctx: document.getElementById(c.id).getContext('2d'), ...c }));

function renderFrame() {
  time++;
  for (const { ctx, preset, label } of contexts) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);
    drawLabel(ctx, label);
    if (running) drawHeatWaves(ctx, PRESETS[preset], time);
  }
}

let lastFrame = 0;
function animate(ts) {
  if (ts - lastFrame >= speed) { renderFrame(); lastFrame = ts; }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-toggle').addEventListener('click', function() {
  running = !running;
  this.textContent = running ? 'Running' : 'Stopped';
  this.classList.toggle('active', running);
});
[['btn-speed-slow',100],['btn-speed-normal',50],['btn-speed-fast',20]].forEach(([id,ms]) => {
  document.getElementById(id).addEventListener('click', function() {
    speed = ms;
    document.querySelectorAll('.controls button:not(#btn-toggle)').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
</body>
</html>
