<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gear Cogs Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive;
  }
  h2 { margin-bottom: 30px; color: #333; font-size: 18px; }
  .scene { display: flex; gap: 100px; align-items: flex-end; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .demo label { font-size: 14px; color: #666; }
  .controls { margin-top: 40px; display: flex; gap: 16px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #e8e0d0; }
  .controls button.active { background: #333; color: #fff; }
</style>
</head>
<body>

<h2>Gear Cogs / Mechanical Working</h2>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-subtle" width="280" height="270"></canvas>
    <label>Subtle — single cog</label>
  </div>
  <div class="demo">
    <canvas id="canvas-medium" width="280" height="270"></canvas>
    <label>Medium — two meshed</label>
  </div>
  <div class="demo">
    <canvas id="canvas-intense" width="280" height="270"></canvas>
    <label>Intense — three cogs</label>
  </div>
</div>

<div class="controls">
  <button id="btn-toggle" class="active">Running</button>
  <button id="btn-speed-slow">Slow</button>
  <button id="btn-speed-normal" class="active">Normal</button>
  <button id="btn-speed-fast">Fast</button>
</div>

<script>
const RECT = { x: 60, y: 120, w: 160, h: 80 };
let running = true;
let speed = 30;
let angle = 0;

function rand(min, max) { return min + Math.random() * (max - min); }

function drawSketchyRect(ctx, x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    const edges = [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];
    for (const [x1,y1,x2,y2] of edges) {
      ctx.moveTo(x1+rand(-1.5,1.5), y1+rand(-1.5,1.5));
      for (let i = 1; i <= 5; i++) {
        const t = i/5;
        ctx.lineTo(x1+(x2-x1)*t+rand(-1,1), y1+(y2-y1)*t+rand(-1,1));
      }
    }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(230, 230, 240, 0.25)';
  ctx.fillRect(x+2, y+2, w-4, h-4);
  ctx.restore();
}

function drawLabel(ctx, text) {
  ctx.save();
  ctx.font = '14px "Comic Sans MS", cursive';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, RECT.x + RECT.w/2, RECT.y + RECT.h/2);
  ctx.restore();
}

// Draw a hand-drawn gear
function drawGear(ctx, cx, cy, outerR, innerR, teeth, rotation, color, opacity) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  ctx.strokeStyle = `rgba(${color}, ${opacity})`;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = `rgba(${color}, ${opacity * 0.15})`;

  // Draw gear teeth
  ctx.beginPath();
  const toothAngle = (Math.PI * 2) / teeth;
  const halfTooth = toothAngle * 0.25;

  for (let i = 0; i < teeth; i++) {
    const a = toothAngle * i;
    const wobble = () => rand(-1.2, 1.2);

    // Inner to outer (tooth rise)
    const ix1 = Math.cos(a - halfTooth) * innerR + wobble();
    const iy1 = Math.sin(a - halfTooth) * innerR + wobble();
    const ox1 = Math.cos(a - halfTooth * 0.7) * outerR + wobble();
    const oy1 = Math.sin(a - halfTooth * 0.7) * outerR + wobble();
    const ox2 = Math.cos(a + halfTooth * 0.7) * outerR + wobble();
    const oy2 = Math.sin(a + halfTooth * 0.7) * outerR + wobble();
    const ix2 = Math.cos(a + halfTooth) * innerR + wobble();
    const iy2 = Math.sin(a + halfTooth) * innerR + wobble();

    // Next valley
    const nextA = toothAngle * (i + 1);
    const ix3 = Math.cos(nextA - halfTooth) * innerR + wobble();
    const iy3 = Math.sin(nextA - halfTooth) * innerR + wobble();

    if (i === 0) ctx.moveTo(ix1, iy1);
    ctx.lineTo(ox1, oy1);
    ctx.lineTo(ox2, oy2);
    ctx.lineTo(ix2, iy2);
    ctx.lineTo(ix3, iy3);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Center hole
  ctx.beginPath();
  const holeR = innerR * 0.3;
  for (let i = 0; i <= 12; i++) {
    const a = (Math.PI * 2 / 12) * i;
    const px = Math.cos(a) * holeR + rand(-0.8, 0.8);
    const py = Math.sin(a) * holeR + rand(-0.8, 0.8);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

const LAYOUTS = {
  subtle: [
    { cx: 0, cy: -10, outerR: 22, innerR: 15, teeth: 8, dir: 1, color: '80, 80, 100', opacity: 0.5 },
  ],
  medium: [
    { cx: -18, cy: -8, outerR: 20, innerR: 14, teeth: 8, dir: 1, color: '80, 80, 100', opacity: 0.55 },
    { cx: 18, cy: -30, outerR: 15, innerR: 10, teeth: 6, dir: -1, color: '100, 80, 80', opacity: 0.55 },
  ],
  intense: [
    { cx: -22, cy: -5, outerR: 22, innerR: 15, teeth: 9, dir: 1, color: '80, 80, 100', opacity: 0.6 },
    { cx: 18, cy: -28, outerR: 16, innerR: 11, teeth: 7, dir: -1, color: '100, 80, 80', opacity: 0.6 },
    { cx: -8, cy: -48, outerR: 12, innerR: 8, teeth: 5, dir: 1, color: '80, 100, 80', opacity: 0.6 },
  ],
};

const canvases = [
  { id: 'canvas-subtle',  preset: 'subtle',  label: 'LLM Call' },
  { id: 'canvas-medium',  preset: 'medium',  label: 'Agent' },
  { id: 'canvas-intense', preset: 'intense', label: 'Pipeline' },
];
const contexts = canvases.map(c => ({ ctx: document.getElementById(c.id).getContext('2d'), ...c }));

function renderFrame() {
  if (running) angle += 0.025;

  for (const { ctx, preset: presetName, label } of contexts) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    drawSketchyRect(ctx, RECT.x, RECT.y, RECT.w, RECT.h);
    drawLabel(ctx, label);

    const anchorX = RECT.x + RECT.w / 2;
    const anchorY = RECT.y;

    for (const gear of LAYOUTS[presetName]) {
      drawGear(
        ctx,
        anchorX + gear.cx,
        anchorY + gear.cy,
        gear.outerR, gear.innerR, gear.teeth,
        angle * gear.dir,
        gear.color, gear.opacity
      );
    }
  }
}

let lastFrame = 0;
function animate(ts) {
  if (ts - lastFrame >= speed) { renderFrame(); lastFrame = ts; }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-toggle').addEventListener('click', function() {
  running = !running;
  this.textContent = running ? 'Running' : 'Stopped';
  this.classList.toggle('active', running);
});
[['btn-speed-slow',60],['btn-speed-normal',30],['btn-speed-fast',12]].forEach(([id,ms]) => {
  document.getElementById(id).addEventListener('click', function() {
    speed = ms;
    document.querySelectorAll('.controls button:not(#btn-toggle)').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
</body>
</html>
