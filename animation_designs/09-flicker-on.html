<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flicker On — Initializing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive;
  }
  h2 { margin-bottom: 8px; color: #333; font-size: 18px; }
  p.sub { margin-bottom: 30px; color: #888; font-size: 13px; }
  .scene { display: flex; gap: 100px; align-items: flex-end; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .demo label { font-size: 14px; color: #666; }
  .controls { margin-top: 40px; display: flex; gap: 16px; }
  .controls button {
    padding: 10px 24px; font-family: inherit; font-size: 14px;
    border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .controls button:hover { background: #e8e0d0; }
  .controls button.active { background: #333; color: #fff; }
</style>
</head>
<body>

<h2>Flicker On</h2>
<p class="sub">Old fluorescent light / TV turning on — flickers then stabilizes</p>

<div class="scene">
  <div class="demo">
    <canvas id="canvas-gentle" width="260" height="220"></canvas>
    <label>Gentle — soft blink</label>
  </div>
  <div class="demo">
    <canvas id="canvas-electric" width="260" height="220"></canvas>
    <label>Electric — buzzy flicker</label>
  </div>
  <div class="demo">
    <canvas id="canvas-glitch" width="260" height="220"></canvas>
    <label>Glitch — digital static</label>
  </div>
</div>

<div class="controls">
  <button id="btn-restart" class="active">Restart</button>
  <button id="btn-speed-slow">Slow</button>
  <button id="btn-speed-normal" class="active">Normal</button>
  <button id="btn-speed-fast">Fast</button>
</div>

<script>
const RECT = { x: 50, y: 70, w: 160, h: 80 };
let speedMult = 1.0;

function rand(min, max) { return min + Math.random() * (max - min); }

const PRESETS = {
  gentle: {
    // Flicker pattern: [time, opacity] keyframes
    flickerPhases: [
      { until: 15, onChance: 0.3, opacity: [0.1, 0.4] },
      { until: 35, onChance: 0.5, opacity: [0.2, 0.6] },
      { until: 55, onChance: 0.7, opacity: [0.4, 0.8] },
      { until: 75, onChance: 0.9, opacity: [0.6, 1.0] },
    ],
    wobble: 1.5, glitchBars: 0, staticDots: 0,
  },
  electric: {
    flickerPhases: [
      { until: 10, onChance: 0.15, opacity: [0.05, 0.3] },
      { until: 25, onChance: 0.4, opacity: [0.1, 0.7] },
      { until: 40, onChance: 0.3, opacity: [0.05, 0.5] }, // dip back down
      { until: 55, onChance: 0.6, opacity: [0.3, 0.8] },
      { until: 70, onChance: 0.85, opacity: [0.5, 1.0] },
    ],
    wobble: 2.5, glitchBars: 0, staticDots: 0,
  },
  glitch: {
    flickerPhases: [
      { until: 12, onChance: 0.2, opacity: [0.05, 0.3] },
      { until: 30, onChance: 0.45, opacity: [0.1, 0.6] },
      { until: 50, onChance: 0.35, opacity: [0.05, 0.5] },
      { until: 65, onChance: 0.7, opacity: [0.3, 0.9] },
      { until: 80, onChance: 0.85, opacity: [0.6, 1.0] },
    ],
    wobble: 3.0, glitchBars: 3, staticDots: 20,
  },
};

class FlickerAnimation {
  constructor(canvasId, presetName) {
    this.ctx = document.getElementById(canvasId).getContext('2d');
    this.preset = PRESETS[presetName];
    this.presetName = presetName;
    this.progress = 0;
    this.done = false;
    this.currentOpacity = 0;
    this.isOn = false;
  }

  reset() {
    this.progress = 0;
    this.done = false;
    this.currentOpacity = 0;
    this.isOn = false;
  }

  update() {
    if (this.done) return;
    this.progress += 0.8 * speedMult;

    if (this.progress >= 100) {
      this.progress = 100;
      this.done = true;
      this.currentOpacity = 1;
      this.isOn = true;
      return;
    }

    // Find current phase
    const phases = this.preset.flickerPhases;
    let phase = phases[phases.length - 1];
    for (const p of phases) {
      if (this.progress < p.until) { phase = p; break; }
    }

    // Flicker decision
    this.isOn = Math.random() < phase.onChance;
    if (this.isOn) {
      this.currentOpacity = rand(phase.opacity[0], phase.opacity[1]);
    } else {
      this.currentOpacity = rand(0, 0.05);
    }
  }

  draw() {
    const ctx = this.ctx;
    const p = this.preset;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

    const alpha = this.currentOpacity;
    if (alpha < 0.02) return;

    // Fill
    ctx.fillStyle = `rgba(255, 240, 220, ${alpha * 0.3})`;
    ctx.fillRect(RECT.x + 2, RECT.y + 2, RECT.w - 4, RECT.h - 4);

    // Sketchy rect
    ctx.strokeStyle = `rgba(30, 30, 30, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      const edges = [
        [RECT.x, RECT.y, RECT.x+RECT.w, RECT.y],
        [RECT.x+RECT.w, RECT.y, RECT.x+RECT.w, RECT.y+RECT.h],
        [RECT.x+RECT.w, RECT.y+RECT.h, RECT.x, RECT.y+RECT.h],
        [RECT.x, RECT.y+RECT.h, RECT.x, RECT.y],
      ];
      for (const [x1,y1,x2,y2] of edges) {
        const jScale = this.done ? 1.5 : p.wobble * (1 + (1 - alpha) * 2);
        ctx.moveTo(x1+rand(-jScale,jScale), y1+rand(-jScale,jScale));
        for (let i = 1; i <= 5; i++) {
          const t = i/5;
          ctx.lineTo(x1+(x2-x1)*t+rand(-jScale,jScale), y1+(y2-y1)*t+rand(-jScale,jScale));
        }
      }
      ctx.stroke();
    }

    // Glitch bars (horizontal scan lines displaced)
    if (p.glitchBars > 0 && !this.done && this.isOn) {
      ctx.save();
      for (let i = 0; i < p.glitchBars; i++) {
        if (Math.random() > 0.4) continue;
        const barY = RECT.y + rand(0, RECT.h);
        const barH = rand(2, 6);
        const shift = rand(-12, 12);
        ctx.fillStyle = `rgba(30, 30, 30, ${alpha * 0.3})`;
        ctx.fillRect(RECT.x + shift, barY, RECT.w, barH);
      }
      ctx.restore();
    }

    // Static dots
    if (p.staticDots > 0 && !this.done && this.isOn) {
      ctx.save();
      ctx.fillStyle = `rgba(30, 30, 30, ${alpha * 0.4})`;
      for (let i = 0; i < p.staticDots; i++) {
        if (Math.random() > 0.5) continue;
        const dx = RECT.x + rand(-5, RECT.w + 5);
        const dy = RECT.y + rand(-5, RECT.h + 5);
        ctx.fillRect(dx, dy, rand(1, 3), rand(1, 3));
      }
      ctx.restore();
    }

    // Label
    const labelAlpha = this.done ? 1 : alpha * 0.8;
    if (labelAlpha > 0.1) {
      ctx.save();
      ctx.font = '14px "Comic Sans MS", cursive';
      ctx.fillStyle = `rgba(85, 85, 85, ${labelAlpha})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labelShift = this.done ? 0 : rand(-1, 1);
      ctx.fillText(
        this.done ? 'Ready' : 'Initializing...',
        RECT.x + RECT.w/2 + labelShift,
        RECT.y + RECT.h/2 + labelShift
      );
      ctx.restore();
    }
  }
}

const anims = [
  new FlickerAnimation('canvas-gentle', 'gentle'),
  new FlickerAnimation('canvas-electric', 'electric'),
  new FlickerAnimation('canvas-glitch', 'glitch'),
];

function restartAll() { for (const a of anims) a.reset(); }

let lastFrame = 0;
function animate(ts) {
  if (ts - lastFrame >= 60) {
    for (const a of anims) { a.update(); a.draw(); }
    lastFrame = ts;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('btn-restart').addEventListener('click', restartAll);
[['btn-speed-slow', 0.4], ['btn-speed-normal', 1.0], ['btn-speed-fast', 2.5]].forEach(([id, s]) => {
  document.getElementById(id).addEventListener('click', function() {
    speedMult = s;
    document.querySelectorAll('.controls button:not(#btn-restart)').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>
</body>
</html>
